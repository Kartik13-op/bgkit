<!DOCTYPE html>
<!--
  GLASS SHARD FIELD
  A depth-sorted 3D field of translucent prisms slowly tumbles through light and tilts toward the cursor.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/glass-shard-field.html?color1=%2379E2D0&color2=%23A9B7FF&color3=%23FFB7D5&bg=%230B1020&text=Refraction" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Glass Shard Field"></iframe>
  Query params:
    color1     hex, first glass tint              default #79E2D0
    color2     hex, second glass tint             default #A9B7FF
    color3     hex, third glass tint              default #FFB7D5
    bg         hex, background color              default #0B1020
    speed      float, animation multiplier        default 1
    density    float, shard count multiplier      default 1
    size       float, shard size multiplier       default 1
    text       optional hero headline             default ""
    textcolor  hex, hero text color               default #FFFFFF
-->
<html lang="en"><head><meta charset="UTF-8"><title>Glass Shard Field</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.5);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  var color1=safeHex(getParam("color1","#79E2D0"),"#79E2D0"),color2=safeHex(getParam("color2","#A9B7FF"),"#A9B7FF"),color3=safeHex(getParam("color3","#FFB7D5"),"#FFB7D5"),bg=safeHex(getParam("bg","#0B1020"),"#0B1020"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");
  document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
  var canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),W,H,dpr,last=0,shards=[],rx=0,ry=0,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,mouse={x:0,y:0,active:false},pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)];
  function rnd(a,b){return a+Math.random()*(b-a)}
  function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=W*.5,mouse.y=H*.5;if(!shards.length)for(var i=0;i<Math.max(28,Math.round(82*density));i++)shards.push({x:rnd(-1,1),y:rnd(-.9,.9),z:rnd(-.8,1),s:rnd(12,45)*size,a:rnd(0,6.28),b:rnd(0,6.28),va:rnd(-.0008,.0008),vb:rnd(-.0007,.0007),c:pal[i%3]})}
  function point(px,py,pz){var cy=Math.cos(ry),sy=Math.sin(ry),cx=Math.cos(rx),sx=Math.sin(rx),x=px*cy-pz*sy,z=px*sy+pz*cy,y=py*cx-z*sx;z=py*sx+z*cx;var k=1/(2.7-z*.7);return{x:W*.5+x*Math.min(W,H)*k,y:H*.5+y*Math.min(W,H)*k,z:z,k:k}}
  function draw(s,dt){s.a+=s.va*dt*speed;s.b+=s.vb*dt*speed;var verts=[],base=[[0,-1,.15],[.82,.55,.3],[-.72,.4,-.18],[.1,.05,.95]];for(var i=0;i<base.length;i++){var q=base[i],ca=Math.cos(s.a),sa=Math.sin(s.a),cb=Math.cos(s.b),sb=Math.sin(s.b),x=q[0]*ca-q[1]*sa,y=q[0]*sa+q[1]*ca,z=q[2],xx=x*cb+z*sb,zz=-x*sb+z*cb;verts.push(point(s.x+xx*s.s/100,s.y+y*s.s/100,s.z+zz*s.s/100))}s.depth=verts.reduce(function(v,q){return v+q.z},0)/verts.length;s.v=verts}
  function paint(s){var v=s.v,c=s.c,alpha=.12+Math.max(0,Math.min(1,(s.depth+1.2)/2.4))*.24;ctx.beginPath();ctx.moveTo(v[0].x,v[0].y);for(var i=1;i<v.length;i++)ctx.lineTo(v[i].x,v[i].y);ctx.closePath();var g=ctx.createLinearGradient(v[0].x,v[0].y,v[2].x,v[2].y);g.addColorStop(0,"rgba("+c.r+","+c.g+","+c.b+","+alpha+")");g.addColorStop(1,"rgba(255,255,255,"+(alpha*.32)+")");ctx.fillStyle=g;ctx.strokeStyle="rgba(255,255,255,"+(alpha*.8)+")";ctx.lineWidth=.8;ctx.fill();ctx.stroke()}
  function render(t,dt){ctx.clearRect(0,0,W,H);var glow=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,Math.min(W,H)*.7);glow.addColorStop(0,"rgba(160,190,255,.16)");glow.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=glow;ctx.fillRect(0,0,W,H);rx+=(mouse.y/H-.5-rx)*.025;ry+=(mouse.x/W-.5-ry)*.025;shards.forEach(function(s){draw(s,dt)});shards.sort(function(a,b){return a.depth-b.depth});ctx.globalCompositeOperation="lighter";shards.forEach(paint);ctx.globalCompositeOperation="source-over"}
  function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.x=W*.5+Math.sin(t*.00015)*W*.22;mouse.y=H*.5+Math.cos(t*.00012)*H*.16}render(t,dt);if(!reduced)requestAnimationFrame(step)}
  addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)
})();
</script></body></html>
