<!DOCTYPE html>
<!--
  ISOMETRIC DRIFT — flat isometric blocks slowly bob and drift in a calm
  grid, like a minimalist city rendered in soft pastel geometry.
  --------------------------------------------------------------------------------------
  <iframe src=".../backgrounds/isometric-drift.html?color1=%236C8CFF&color2=%2398E2C6&color3=%23FFC876&bg=%23F4F6FA&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color1     hex, block color A           default #6C8CFF
    color2     hex, block color B           default #98E2C6
    color3     hex, block color C           default #FFC876
    bg         hex, background color        default #F4F6FA
    density    float multiplier for count   default 1  (capped)
    speed      float multiplier for motion  default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #1D1D1F

  PERF: block count hard-capped at 60. Each block is 3 flat polygon fills
  (top/left/right face) drawn directly — no gradients, no shadow, no
  per-frame trig beyond simple sin() for bob offset.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Isometric Drift Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#F4F6FA; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:700;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    opacity:0;
    animation:reveal 1.2s ease forwards 0.2s;
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } from{ opacity:0; transform:translateY(12px); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){ return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback; }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function shade(rgb, factor){
    return "rgb(" + Math.round(rgb.r*factor) + "," + Math.round(rgb.g*factor) + "," + Math.round(rgb.b*factor) + ")";
  }

  var color1 = safeHex(getParam("color1", "#6C8CFF"), "#6C8CFF");
  var color2 = safeHex(getParam("color2", "#98E2C6"), "#98E2C6");
  var color3 = safeHex(getParam("color3", "#FFC876"), "#FFC876");
  var bg = safeHex(getParam("bg", "#F4F6FA"), "#F4F6FA");
  var density = Math.min(2.5, Math.max(0.3, parseFloat(getParam("density", "1")) || 1));
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#1D1D1F"), "#1D1D1F");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var colors = [hexToRgb(color1), hexToRgb(color2), hexToRgb(color3)];

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, DPR;
  var blocks = [];
  var MAX_BLOCKS = 60;
  var mouse = { x:-9999, y:-9999 };

  function resize(){
    DPR = Math.min(1.5, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    var count = Math.max(20, Math.min(MAX_BLOCKS, Math.round(36 * density)));
    var cols = Math.ceil(Math.sqrt(count * (W/H)));
    var rows = Math.ceil(count / cols);
    var cellW = W / cols;
    var cellH = H / rows;

    blocks = [];
    var idx = 0;
    for(var iy=0; iy<rows; iy++){
      for(var ix=0; ix<cols; ix++){
        if(idx >= count) break;
        blocks.push({
          x: (ix + 0.5) * cellW,
          y: (iy + 0.5) * cellH,
          size: Math.min(cellW, cellH) * 0.34,
          colorIdx: idx % colors.length,
          phase: Math.random() * Math.PI * 2,
          bobAmt: 4 + Math.random()*5
        });
        idx++;
      }
    }
  }

  window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  window.addEventListener("mouseleave", function(){ mouse.x=-9999; mouse.y=-9999; });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; } }, {passive:true});

  var t = 0;
  var running = true;
  document.addEventListener("visibilitychange", function(){ running = !document.hidden; if(running) requestAnimationFrame(step); });

  function drawBlock(cx, cy, size, rgb){
    var topRgb = shade(rgb, 1.0);
    var leftRgb = shade(rgb, 0.78);
    var rightRgb = shade(rgb, 0.62);
    var hw = size, hh = size * 0.58;

    // top diamond
    ctx.beginPath();
    ctx.moveTo(cx, cy - hh);
    ctx.lineTo(cx + hw, cy - hh*0.15);
    ctx.lineTo(cx, cy + hh*0.7);
    ctx.lineTo(cx - hw, cy - hh*0.15);
    ctx.closePath();
    ctx.fillStyle = topRgb;
    ctx.fill();

    // left face
    ctx.beginPath();
    ctx.moveTo(cx - hw, cy - hh*0.15);
    ctx.lineTo(cx, cy + hh*0.7);
    ctx.lineTo(cx, cy + hh*1.4);
    ctx.lineTo(cx - hw, cy + hh*0.55);
    ctx.closePath();
    ctx.fillStyle = leftRgb;
    ctx.fill();

    // right face
    ctx.beginPath();
    ctx.moveTo(cx + hw, cy - hh*0.15);
    ctx.lineTo(cx, cy + hh*0.7);
    ctx.lineTo(cx, cy + hh*1.4);
    ctx.lineTo(cx + hw, cy + hh*0.55);
    ctx.closePath();
    ctx.fillStyle = rightRgb;
    ctx.fill();
  }

  function step(){
    if(!running) return;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    if(!reduced) t += 0.012 * speed;

    for(var i=0;i<blocks.length;i++){
      var b = blocks[i];
      var bob = Math.sin(t + b.phase) * b.bobAmt;

      var dx = mouse.x - b.x, dy = mouse.y - b.y;
      var distSq = dx*dx + dy*dy;
      var lift = 0;
      if(distSq < 40000){
        lift = (1 - Math.sqrt(distSq)/200) * 14;
      }

      drawBlock(b.x, b.y - bob - lift, b.size, colors[b.colorIdx]);
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
