none!important}.hero span{opacity:1}}</style></head><body><div class="stage" style="--bg:#080B18;--c1:#FF4D9D;--c2:#7C5CFF;--c3:#18D6C5;--tc:#FFF"><div class="band b1"></div><div class="band b2"></div><div class="band b3"></div><div class="line"></div><div class="hero"><span id="heroText"></span></div></div><script>(function(){function p(n,d){var v=new URLSearchParams(location.search).get(n);return v===null||v===""?d:v}function h(v,d){return /^#([0-9a-f]{3}){1,2}$/i.test(v)?v:d}var s=document.querySelector('.stage');s.style.setProperty('--bg',h(p('bg','#080B18'),'#080B18'));s.style.setProperty('--c1',h(p('color1','#FF4D9D'),'#FF4D9D'));s.style.setProperty('--c2',h(p('color2','#7C5CFF'),'#7C5CFF'));s.style.setProperty('--c3',h(p('color3','#18D6C5'),'#18D6C5'));s.style.setProperty('--tc',h(p('textcolor','#FFFFFF'),'#FFFFFF'));var k=1/(parseFloat(p('speed','1'))||1);document.querySelectorAll('.band').forEach(function(e){var a=getComputedStyle(e).animationDuration;if(a!=='0s')e.style.animationDuration=parseFloat(a)*k+'s'});var t=p('text','');if(t)document.getElementById('heroText').textContent=t})();</script></body></html>
