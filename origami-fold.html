<!DOCTYPE html>
<!--
  ORIGAMI FOLD — a wall of flat paper-fold triangles slowly flips in waves,
  like a kinetic logo installation, brightening near the cursor.
  --------------------------------------------------------------------------------------
  <iframe src=".../backgrounds/origami-fold.html?color1=%23FF6B6B&color2=%23FFD166&bg=%2315171C&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color1     hex, fold color A            default #FF6B6B
    color2     hex, fold color B            default #FFD166
    bg         hex, background color        default #15171C
    size       int px, tile size            default 64
    speed      float multiplier for motion  default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF

  PERF: tile count capped at ~500 by scaling tile size up on large viewports.
  Each tile is 2 flat-fill triangles (no gradients, no shadow). scaleY via
  ctx transform approximates the "flip" instead of true 3D math.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Origami Fold Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#15171C; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 24px rgba(0,0,0,0.5);
    opacity:0;
    animation:reveal 1.2s ease forwards 0.2s;
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } from{ opacity:0; transform:translateY(12px); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){ return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback; }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function shade(rgb, f){ return "rgb(" + Math.round(rgb.r*f) + "," + Math.round(rgb.g*f) + "," + Math.round(rgb.b*f) + ")"; }

  var color1 = safeHex(getParam("color1", "#FF6B6B"), "#FF6B6B");
  var color2 = safeHex(getParam("color2", "#FFD166"), "#FFD166");
  var bg = safeHex(getParam("bg", "#15171C"), "#15171C");
  var baseSize = parseInt(getParam("size", "64"), 10) || 64;
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var c1 = hexToRgb(color1), c2 = hexToRgb(color2);

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, DPR;
  var cols, rows, tile;
  var tiles = [];
  var MAX_TILES = 500;
  var mouse = { x:-9999, y:-9999 };
  var t = 0;

  function resize(){
    DPR = Math.min(1.5, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    tile = baseSize;
    var est = (W/tile) * (H/tile);
    if(est > MAX_TILES){
      tile = tile * Math.sqrt(est / MAX_TILES);
    }
    cols = Math.ceil(W/tile) + 1;
    rows = Math.ceil(H/tile) + 1;

    tiles = [];
    for(var iy=0; iy<rows; iy++){
      for(var ix=0; ix<cols; ix++){
        tiles.push({
          x: ix*tile, y: iy*tile,
          phase: (ix + iy) * 0.35,
          mix: Math.random()
        });
      }
    }
  }

  window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  window.addEventListener("mouseleave", function(){ mouse.x=-9999; mouse.y=-9999; });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; } }, {passive:true});

  var running = true;
  document.addEventListener("visibilitychange", function(){ running = !document.hidden; if(running) requestAnimationFrame(step); });

  function step(){
    if(!running) return;
    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);

    if(!reduced) t += 0.02 * speed;

    for(var i=0;i<tiles.length;i++){
      var tl = tiles[i];
      var wave = Math.sin(t - tl.phase);
      var flip = (wave + 1) / 2; // 0..1

      var dx = mouse.x - (tl.x+tile/2), dy = mouse.y - (tl.y+tile/2);
      var distSq = dx*dx + dy*dy;
      var boost = distSq < 32400 ? (1 - Math.sqrt(distSq)/180) : 0; // 180px radius

      var lightness = 0.55 + flip*0.45 + boost*0.4;
      var rgb = tl.mix > 0.5 ? c1 : c2;
      var topColor = shade(rgb, Math.min(1.4, lightness));
      var botColor = shade(rgb, Math.min(1.4, lightness) * 0.55);

      var cx = tl.x + tile/2, cy = tl.y + tile/2;
      var scaleY = 0.3 + Math.abs(wave) * 0.7;

      ctx.save();
      ctx.translate(cx, cy);
      ctx.scale(1, scaleY);
      var hw = tile*0.46, hh = tile*0.46;

      ctx.beginPath();
      ctx.moveTo(-hw, -hh);
      ctx.lineTo(hw, -hh);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = topColor;
      ctx.fill();

      ctx.beginPath();
      ctx.moveTo(-hw, hh);
      ctx.lineTo(hw, hh);
      ctx.lineTo(0, 0);
      ctx.closePath();
      ctx.fillStyle = botColor;
      ctx.fill();

      ctx.restore();
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
