<!DOCTYPE html>
<!--
  EMBER SWARM
  Thousands of warm drifting embers swirl in fluid currents and scatter away from the cursor.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/ember-swarm.html?color1=%23FF5F3D&color2=%23FFB84A&color3=%23FFE8A3&bg=%23140A12&text=Keep%20the%20spark" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Ember Swarm"></iframe>
  Query params:
    color1     hex, red ember color                default #FF5F3D
    color2     hex, gold ember color               default #FFB84A
    color3     hex, pale ember color               default #FFE8A3
    bg         hex, background color               default #140A12
    speed      float, current multiplier           default 1
    density    float, ember count multiplier       default 1
    size       float, ember size multiplier        default 1
    text       optional hero headline              default ""
    textcolor  hex, hero text color                default #FFFFFF
-->
<html lang="en"><head><meta charset="UTF-8"><title>Ember Swarm</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.5);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){function getParam(name, fallback){var v = new URLSearchParams(window.location.search).get(name);return (v === null || v === "") ? fallback : v;}function safeHex(v, fallback){return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;}function hexToRgb(hex){hex = hex.replace('#','');if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }var num = parseInt(hex,16);return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };}
var color1=safeHex(getParam("color1","#FF5F3D"),"#FF5F3D"),color2=safeHex(getParam("color2","#FFB84A"),"#FFB84A"),color3=safeHex(getParam("color3","#FFE8A3"),"#FFE8A3"),bg=safeHex(getParam("bg","#140A12"),"#140A12"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,last=0,embers=[],mouse={x:0,y:0,active:false},reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)];function rnd(a,b){return a+Math.random()*(b-a)}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=W*.5,mouse.y=H*.5;if(!embers.length)for(var i=0;i<Math.round(340*density);i++)embers.push({x:rnd(0,W),y:rnd(0,H),s:rnd(.5,2.3)*size,p:rnd(0,6.28),c:pal[i%3],a:rnd(.18,.9)})}function render(t,dt){ctx.clearRect(0,0,W,H);ctx.globalCompositeOperation="lighter";embers.forEach(function(e){if(!reduced){var flow=Math.sin(e.y*.009+t*.00045+e.p)*.04*dt*speed;e.x+=flow;e.y-=dt*(.012+Math.cos(e.x*.01+t*.0003)*.008)*speed;var dx=e.x-mouse.x,dy=e.y-mouse.y,dd=Math.sqrt(dx*dx+dy*dy)||1,force=Math.max(0,1-dd/170);e.x+=dx/dd*force*dt*.13;e.y+=dy/dd*force*dt*.13}if(e.y<-8){e.y=H+8;e.x=rnd(0,W)}if(e.x<-8)e.x=W+8;if(e.x>W+8)e.x=-8;var q=e.c,alpha=e.a*(.6+Math.sin(t*.003+e.p)*.4);ctx.fillStyle="rgba("+q.r+","+q.g+","+q.b+","+alpha+")";ctx.beginPath();ctx.arc(e.x,e.y,e.s,0,6.283);ctx.fill()});ctx.globalCompositeOperation="source-over"}function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.x=W*.5+Math.sin(t*.0002)*W*.13;mouse.y=H*.55+Math.cos(t*.00017)*H*.14}render(t,dt);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)})();
</script></body></html>
