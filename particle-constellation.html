<!DOCTYPE html>
<!--
  PARTICLE CONSTELLATION — connected particles that react to cursor
  -------------------------------------------------------------------
  <iframe src=".../backgrounds/particle-constellation.html?color=%2300F0FF&bg=%2305070D&density=1&speed=1&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color      hex, dot & line color         default #7DF9FF
    bg         hex, background color         default #05070D
    density    float multiplier for count    default 1
    speed      float multiplier for motion   default 1
    linklen    max px distance to connect    default 140
    text       optional hero text overlay    default "" (none)
    textcolor  hex, hero text color          default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Particle Constellation Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#05070D; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.6);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  var color = safeHex(getParam("color", "#7DF9FF"), "#7DF9FF");
  var bg = safeHex(getParam("bg", "#05070D"), "#05070D");
  var density = parseFloat(getParam("density", "1")) || 1;
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var linkLen = parseFloat(getParam("linklen", "140")) || 140;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb = hexToRgb(color);
  var rgbStr = rgb.r + "," + rgb.g + "," + rgb.b;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, particles = [];
  var mouse = { x:null, y:null, active:false };

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var count = Math.floor((W*H) / 9000 * density);
    particles = [];
    for(var i=0;i<count;i++){
      particles.push({
        x: Math.random()*W,
        y: Math.random()*H,
        vx: (Math.random()-0.5) * 0.4 * speed,
        vy: (Math.random()-0.5) * 0.4 * speed,
        r: Math.random()*1.6 + 0.8
      });
    }
  }

  function step(){
    ctx.clearRect(0,0,W,H);

    // update + draw particles
    for(var i=0;i<particles.length;i++){
      var p = particles[i];
      p.x += p.vx;
      p.y += p.vy;
      if(p.x < 0 || p.x > W) p.vx *= -1;
      if(p.y < 0 || p.y > H) p.vy *= -1;

      // gentle attraction toward mouse
      if(mouse.active){
        var dx = mouse.x - p.x, dy = mouse.y - p.y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < 180){
          p.x -= dx*0.0025;
          p.y -= dy*0.0025;
        }
      }

      ctx.beginPath();
      ctx.arc(p.x, p.y, p.r, 0, Math.PI*2);
      ctx.fillStyle = "rgba(" + rgbStr + ",0.85)";
      ctx.fill();
    }

    // connect nearby particles
    for(var a=0;a<particles.length;a++){
      for(var b=a+1;b<particles.length;b++){
        var dx = particles[a].x - particles[b].x;
        var dy = particles[a].y - particles[b].y;
        var dist = Math.sqrt(dx*dx+dy*dy);
        if(dist < linkLen){
          var op = (1 - dist/linkLen) * 0.5;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(particles[b].x, particles[b].y);
          ctx.strokeStyle = "rgba(" + rgbStr + "," + op + ")";
          ctx.lineWidth = 1;
          ctx.stroke();
        }
      }
      // connect to mouse if close
      if(mouse.active){
        var dx2 = particles[a].x - mouse.x;
        var dy2 = particles[a].y - mouse.y;
        var dist2 = Math.sqrt(dx2*dx2+dy2*dy2);
        if(dist2 < linkLen*1.3){
          var op2 = (1 - dist2/(linkLen*1.3)) * 0.7;
          ctx.beginPath();
          ctx.moveTo(particles[a].x, particles[a].y);
          ctx.lineTo(mouse.x, mouse.y);
          ctx.strokeStyle = "rgba(" + rgbStr + "," + op2 + ")";
          ctx.stroke();
        }
      }
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  }, { passive:true });
  window.addEventListener("mouseleave", function(){ mouse.active = false; });
  window.addEventListener("touchmove", function(e){
    if(e.touches[0]){
      mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true;
    }
  }, { passive:true });

  resize();
  step();
})();
</script>
</body>
</html>
