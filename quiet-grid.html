<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Quiet Grid</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#f3f1ec}.stage{height:100%;position:relative;background:var(--bg);overflow:hidden}.grid{position:absolute;inset:-10%;background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:clamp(28px,4vw,58px) clamp(28px,4vw,58px);transform:perspective(800px) rotateX(54deg) scale(1.6) translateY(24%);transform-origin:center bottom;opacity:.65}.glow{position:absolute;width:45vw;height:45vw;left:var(--x,50%);top:var(--y,45%);transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,var(--accent),transparent 68%);filter:blur(30px);opacity:.18;transition:left 1.2s ease,top 1.2s ease}.hero{position:absolute;inset:0;display:grid;place-items:center;color:var(--tc);font:500 clamp(1.5rem,4vw,3.5rem)/1.1 system-ui,sans-serif;letter-spacing:-.04em;text-align:center}.hero span{opacity:0;animation:in 1.2s ease forwards}@keyframes in{to{opacity:1}from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){.hero span{animation:none;opacity:1}}</style></head><body><div class="stage" style="--bg:#F3F1EC;--line:rgba(47,43,38,.12);--accent:#A68B6A;--tc:#2F2B26"><div class="grid"></div><div class="glow"></div><div class="hero"><span id="heroText"></span></div></div><script>(function(){function p(n,d){var v=new URLSearchParams(location.search).get(n);return v===null||v===''?d:v}function h(v,d){return /^#([0-9a-f]{3}){1,2}$/i.test(v)?v:d}var s=document.querySelector('.stage'),vals={bg:['bg','#F3F1EC'],line:['line','rgba(47,43,38,.12)'],accent:['color','#A68B6A'],tc:['textcolor','#2F2B26']};Object.keys(vals).forEach(function(k){var q=vals[k];s.style.setProperty('--'+k,k==='line'?p(q[0],q[1]):h(p(q[0],q[1]),q[1]))});var t=p('text','');if(t)document.getElementById('heroText').textContent=t;addEventListener('pointermove',function(e){s.style.setProperty('--x',e.clientX+'px');s.style.setProperty('--y',e.clientY+'px')})})();</script></body></html>
