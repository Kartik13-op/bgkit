<!DOCTYPE html>
<!--
  SAND DUNES — flowing sine-wave terrain ridges drifting like desert dunes
  -------------------------------------------------------------------------
  <iframe src="sand-dunes.html?color1=%23F5A623&color2=%23D0021B&bg=%231A0A00&speed=1&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color1     hex, primary dune color      default #F5A623
    color2     hex, accent dune color       default #D0021B
    bg         hex, background color        default #1A0A00
    speed      float multiplier for motion  default 1
    layers     int, number of dune layers   default 7
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Sand Dunes Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.6);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function lerpColor(a, b, t){
    return {
      r: Math.round(a.r + (b.r - a.r)*t),
      g: Math.round(a.g + (b.g - a.g)*t),
      b: Math.round(a.b + (b.b - a.b)*t)
    };
  }

  var c1hex = safeHex(getParam("color1", "#F5A623"), "#F5A623");
  var c2hex = safeHex(getParam("color2", "#D0021B"), "#D0021B");
  var bg = safeHex(getParam("bg", "#1A0A00"), "#1A0A00");
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var layers = Math.max(3, Math.min(14, parseInt(getParam("layers", "7")) || 7));
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  var c1 = hexToRgb(c1hex);
  var c2 = hexToRgb(c2hex);
  var bgRgb = hexToRgb(bg);

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H;
  var mouse = { x: -1, y: -1, active: false };
  var t = 0;

  function duneY(layer, x, time){
    var freq1 = 0.0045 + layer * 0.0008;
    var freq2 = 0.0091 + layer * 0.0005;
    var amp = H * (0.08 + layer * 0.015);
    var phase = layer * 1.3;
    var mouseInfluence = 0;
    if(mouse.active){
      var dx = x - mouse.x;
      var dist = Math.abs(dx);
      if(dist < 280){
        var offset = (mouse.y / H - 0.5) * 0.25 * H;
        mouseInfluence = offset * (1 - dist/280) * Math.exp(-dist/200);
      }
    }
    return H * (0.45 + layer * 0.045) +
           Math.sin(x * freq1 + time * 0.38 + phase) * amp +
           Math.sin(x * freq2 - time * 0.21 + phase * 1.7) * amp * 0.5 +
           mouseInfluence;
  }

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
  }

  function step(){
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // draw sky gradient at top
    var sky = ctx.createLinearGradient(0,0,0,H*0.5);
    sky.addColorStop(0, bg);
    sky.addColorStop(1, "rgba(" + bgRgb.r + "," + bgRgb.g + "," + bgRgb.b + ",0)");
    ctx.fillStyle = sky;
    ctx.fillRect(0,0,W,H);

    for(var l = layers-1; l >= 0; l--){
      var tt = l / (layers-1);
      var layerColor = lerpColor(c2, c1, tt);
      var alpha = 0.55 + tt * 0.45;

      // slight shimmer highlight at crest
      var grad = ctx.createLinearGradient(0,0,0,H);
      grad.addColorStop(0, "rgba(" + Math.min(255,layerColor.r+50) + "," + Math.min(255,layerColor.g+40) + "," + Math.min(255,layerColor.b+20) + "," + alpha + ")");
      grad.addColorStop(0.12, "rgba(" + layerColor.r + "," + layerColor.g + "," + layerColor.b + "," + alpha + ")");
      grad.addColorStop(1, "rgba(" + Math.max(0,layerColor.r-40) + "," + Math.max(0,layerColor.g-30) + "," + Math.max(0,layerColor.b-20) + "," + alpha + ")");

      ctx.beginPath();
      ctx.moveTo(0, H);
      for(var x=0; x<=W; x+=4){
        ctx.lineTo(x, duneY(l, x, t));
      }
      ctx.lineTo(W, H);
      ctx.closePath();
      ctx.fillStyle = grad;
      ctx.fill();

      // crest line
      ctx.beginPath();
      ctx.moveTo(0, duneY(l, 0, t));
      for(var x2=4; x2<=W; x2+=4){
        ctx.lineTo(x2, duneY(l, x2, t));
      }
      ctx.strokeStyle = "rgba(255,255,220," + (0.12 * tt) + ")";
      ctx.lineWidth = 1.5;
      ctx.stroke();
    }

    t += 0.012 * speed;
    requestAnimationFrame(step);
  }

  if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){
    resize(); step();
    cancelAnimationFrame(window._rafId);
  } else {
    window.addEventListener("resize", resize, { passive:true });
    window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; }, { passive:true });
    window.addEventListener("mouseleave", function(){ mouse.active=false; });
    window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; mouse.active=true; } }, { passive:true });
    resize();
    step();
  }
})();
</script>
</body>
</html>
