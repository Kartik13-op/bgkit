<!DOCTYPE html>
<!--
  CHROMATIC INK BLOOM
  ================================================================
  Soft pools of colored ink expand through dark water, with pigment flecks drifting
  around the blooms and fresh rings appearing wherever the pointer or a touch lands.

  Embed:
    <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/chromatic-ink-bloom.html?color1=%23FFB347&color2=%235DE2E7&color3=%23E68CFF&bg=%230B1020&text=Make%20a%20splash"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;"
      loading="lazy" title="Chromatic Ink Bloom"></iframe>

  Query params:
    color1     hex, first ink color                  default #FFB347
    color2     hex, second ink color                 default #5DE2E7
    color3     hex, third ink color                  default #E68CFF
    bg         hex, background color                 default #0B1020
    speed      float multiplier for motion           default 1
    density    float multiplier for pigment count    default 1
    radius     float, maximum bloom radius in px      default 230
    text       optional hero text overlay            default "" (none)
    textcolor  hex, hero text color                  default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Chromatic Ink Bloom</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ---------- BASE SCAFFOLD (keep as-is) ---------- */
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
  }
  canvas{ position:absolute; inset:0; display:block; }

  .hero{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }

  /* ---------- YOUR CUSTOM STYLES BELOW ---------- */

</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  /* ---------- SHARED PARAM HELPERS (keep as-is) ---------- */
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  /* ---------- READ PARAMS (extend as needed, keep names consistent across templates) ---------- */
  var color1 = safeHex(getParam("color1", "#FFB347"), "#FFB347");
  var color2 = safeHex(getParam("color2", "#5DE2E7"), "#5DE2E7");
  var color3 = safeHex(getParam("color3", "#E68CFF"), "#E68CFF");
  var bg = safeHex(getParam("bg", "#0B1020"), "#0B1020");
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var density = parseFloat(getParam("density", "1")) || 1;
  var radius = parseFloat(getParam("radius", "230")) || 230;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb1 = hexToRgb(color1);
  var rgb2 = hexToRgb(color2);
  var rgb3 = hexToRgb(color3);
  var rgbStr = rgb1.r + "," + rgb1.g + "," + rgb1.b;

  /* ---------- YOUR EFFECT LOGIC BELOW ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, dpr;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var mouse = { x:0, y:0, active:false };
  var drops = [], blooms = [], last = 0, lastSplash = 0;
  var palette = [rgb1, rgb2, rgb3];

  function rand(min,max){ return min + Math.random() * (max-min); }
  function clampBloom(b){
    var edge = Math.min(Math.max(24,b.max*0.34), Math.min(W,H)*0.45);
    b.x = Math.max(edge, Math.min(W-edge,b.x));
    b.y = Math.max(edge, Math.min(H-edge,b.y));
  }
  function resize(){
    W = canvas.clientWidth = window.innerWidth;
    H = canvas.clientHeight = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W * dpr);
    canvas.height = Math.floor(H * dpr);
    ctx.setTransform(dpr,0,0,dpr,0,0);
    var count = Math.max(10, Math.round(38 * Math.min(2, Math.max(0.3, density))));
    drops = [];
    for(var i=0;i<count;i++) drops.push({
      x:rand(0,W), y:rand(0,H), r:rand(0.7,2.8),
      vx:rand(-0.12,0.12), vy:rand(-0.18,0.08),
      a:rand(0.16,0.6), color:palette[i%palette.length]
    });
    if(!blooms.length){
      blooms.push({x:W*0.5,y:H*0.44,r:0,max:radius*0.82,age:0,life:1.3,color:palette[0],a:0.55});
      blooms.push({x:W*0.5,y:H*0.58,r:0,max:radius*0.7,age:0,life:1.6,color:palette[1],a:0.48});
    }
    blooms.forEach(clampBloom);
  }
  function splash(x,y){
    var bloom={x:x,y:y,r:8,max:radius*rand(0.7,1.1),age:0,life:rand(1.8,3.2),color:palette[Math.floor(rand(0,palette.length))],a:0.8};
    clampBloom(bloom); blooms.push(bloom);
    for(var i=0;i<5;i++) drops.push({x:x+rand(-10,10),y:y+rand(-10,10),r:rand(1,3.5),vx:rand(-0.7,0.7),vy:rand(-0.7,0.7),a:rand(0.35,0.8),color:palette[i%3],temporary:1});
  }
  function drawBloom(b,dt){
    b.age += dt * 0.001 * speed;
    var t = b.age / b.life;
    b.r += (b.max - b.r) * Math.min(1, dt * 0.0018 * speed);
    if(t > 1) return false;
    var fade = Math.sin(Math.PI * Math.min(1,t));
    var glow = ctx.createRadialGradient(b.x,b.y,0,b.x,b.y,b.r);
    var c = b.color;
    glow.addColorStop(0, "rgba("+c.r+","+c.g+","+c.b+","+(b.a*fade*0.22)+")");
    glow.addColorStop(0.48, "rgba("+c.r+","+c.g+","+c.b+","+(b.a*fade*0.08)+")");
    glow.addColorStop(1, "rgba("+c.r+","+c.g+","+c.b+",0)");
    ctx.fillStyle = glow;
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = "rgba("+c.r+","+c.g+","+c.b+","+(b.a*fade*0.42)+")";
    ctx.lineWidth = 1.2 + 3 * (1-t);
    ctx.beginPath(); ctx.arc(b.x,b.y,b.r*(0.7+0.3*t),0,Math.PI*2); ctx.stroke();
    return true;
  }
  function render(dt){
    ctx.globalCompositeOperation = "source-over";
    ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);
    ctx.globalCompositeOperation = "lighter";
    blooms = blooms.filter(function(b){ return drawBloom(b,dt); });
    drops.forEach(function(p){
      if(!reduced){ p.x += p.vx * dt * speed; p.y += p.vy * dt * speed; }
      if(p.x < -8) p.x=W+8; if(p.x>W+8) p.x=-8; if(p.y < -8) p.y=H+8; if(p.y>H+8) p.y=-8;
      ctx.fillStyle = "rgba("+p.color.r+","+p.color.g+","+p.color.b+","+p.a+")";
      ctx.beginPath(); ctx.arc(p.x,p.y,p.r,0,Math.PI*2); ctx.fill();
    });
    drops = drops.filter(function(p){ if(p.temporary){ p.a -= dt*0.0004; return p.a > 0; } return true; });
    ctx.globalCompositeOperation = "source-over";
  }
  function step(now){
    var dt = Math.min(40, now-last || 16); last = now;
    render(dt);
    if(!reduced) requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){
    mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true;
    if(e.buttons && e.timeStamp-lastSplash>100){ splash(mouse.x,mouse.y); lastSplash=e.timeStamp; }
  }, { passive:true });
  window.addEventListener("mouseleave", function(){ mouse.active=false; });
  window.addEventListener("click", function(e){ splash(e.clientX,e.clientY); });
  window.addEventListener("touchstart", function(e){ if(e.touches[0]) splash(e.touches[0].clientX,e.touches[0].clientY); }, { passive:true });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; mouse.active=true; } }, { passive:true });

  resize();
  if(reduced){ render(16); }
  else { requestAnimationFrame(step); }
})();
</script>
</body>
</html>
