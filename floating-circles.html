<!DOCTYPE html>
<!--
  FLOATING CIRCLES — large translucent circles drifting at different depths
  --------------------------------------------------------------------------
  @name: Floating Circles
  @slug: floating-circles
  @description: Layered translucent circles floating at varying speeds — calm, modern, text-friendly.
  @tags: ambient, minimal, gradient

  Query params:
    color1     hex, circle color 1          default #3B82F6
    color2     hex, circle color 2          default #8B5CF6
    color3     hex, circle color 3          default #06B6D4
    bg         hex, background color        default #0B1121
    speed      float multiplier             default 1
    text       optional hero text           default ""
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Floating Circles Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem,5vw,4rem); font-weight:600; letter-spacing:-0.02em;
    text-align:center; padding:0 1rem; text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0; animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(n,f){var v=new URLSearchParams(location.search).get(n);return v===null||v===""?f:v}
  function safeHex(v,f){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:f}
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return{r:(n>>16)&255,g:(n>>8)&255,b:n&255}}

  var colors=[
    safeHex(getParam("color1","#3B82F6"),"#3B82F6"),
    safeHex(getParam("color2","#8B5CF6"),"#8B5CF6"),
    safeHex(getParam("color3","#06B6D4"),"#06B6D4")
  ].map(hexToRgb);
  var bg=safeHex(getParam("bg","#0B1121"),"#0B1121");
  var speed=parseFloat(getParam("speed","1"))||1;
  var text=getParam("text","");
  var textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");

  document.body.style.background=bg;
  document.getElementById("heroText").style.color=textColor;
  if(text) document.getElementById("heroText").textContent=text;

  var canvas=document.getElementById("c");
  var ctx=canvas.getContext("2d");
  var W,H,circles=[];

  function Circle(){
    var c=colors[Math.floor(Math.random()*colors.length)];
    this.r=80+Math.random()*220;
    this.x=Math.random()*W;
    this.y=Math.random()*H;
    this.vx=(Math.random()-0.5)*0.25*speed;
    this.vy=(Math.random()-0.5)*0.25*speed;
    this.color=c;
    this.alpha=0.06+Math.random()*0.1;
    this.phase=Math.random()*Math.PI*2;
    this.breatheSpeed=0.2+Math.random()*0.3;
  }

  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    circles=[];
    var count=8+Math.floor(W*H/120000);
    for(var i=0;i<count;i++) circles.push(new Circle());
  }

  var t=0;
  function step(){
    ctx.fillStyle=bg;
    ctx.fillRect(0,0,W,H);

    for(var i=0;i<circles.length;i++){
      var ci=circles[i];
      ci.x+=ci.vx; ci.y+=ci.vy;
      if(ci.x<-ci.r) ci.x=W+ci.r;
      if(ci.x>W+ci.r) ci.x=-ci.r;
      if(ci.y<-ci.r) ci.y=H+ci.r;
      if(ci.y>H+ci.r) ci.y=-ci.r;

      var breathe=1+0.15*Math.sin(t*ci.breatheSpeed+ci.phase);
      var r=ci.r*breathe;

      var grd=ctx.createRadialGradient(ci.x,ci.y,0,ci.x,ci.y,r);
      grd.addColorStop(0,"rgba("+ci.color.r+","+ci.color.g+","+ci.color.b+","+(ci.alpha*1.5)+")");
      grd.addColorStop(0.7,"rgba("+ci.color.r+","+ci.color.g+","+ci.color.b+","+(ci.alpha*0.5)+")");
      grd.addColorStop(1,"rgba("+ci.color.r+","+ci.color.g+","+ci.color.b+",0)");
      ctx.beginPath();
      ctx.arc(ci.x,ci.y,r,0,Math.PI*2);
      ctx.fillStyle=grd;
      ctx.fill();
    }
    t+=0.02*speed;
    requestAnimationFrame(step);
  }

  window.addEventListener("resize",resize,{passive:true});
  resize(); step();
})();
</script>
</body>
</html>
