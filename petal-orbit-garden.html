<!DOCTYPE html>
<!--
  PETAL ORBIT GARDEN
  Soft flowers open and rotate in a slow generative garden, leaning toward the pointer like sunflowers.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/petal-orbit-garden.html?color1=%23F29E4B&color2=%23D95D8A&color3=%2377BFA3&bg=%23FFF8F0&text=Let%20it%20bloom" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Petal Orbit Garden"></iframe>
  Query params:
    color1     hex, first petal color              default #F29E4B
    color2     hex, second petal color             default #D95D8A
    color3     hex, third petal color              default #77BFA3
    bg         hex, background color               default #FFF8F0
    speed      float, animation multiplier          default 1
    density    float, bloom count multiplier        default 1
    size       float, petal size multiplier         default 1
    text       optional hero headline               default ""
    textcolor  hex, hero text color                 default #30252A
-->
<html lang="en"><head><meta charset="UTF-8"><title>Petal Orbit Garden</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.14);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){function getParam(name,fallback){var v=new URLSearchParams(window.location.search).get(name);return(v===null||v==="")?fallback:v}function safeHex(v,fallback){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:fallback}function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(function(c){return c+c}).join('');var num=parseInt(hex,16);return{r:(num>>16)&255,g:(num>>8)&255,b:num&255}}
var color1=safeHex(getParam("color1","#F29E4B"),"#F29E4B"),color2=safeHex(getParam("color2","#D95D8A"),"#D95D8A"),color3=safeHex(getParam("color3","#77BFA3"),"#77BFA3"),bg=safeHex(getParam("bg","#FFF8F0"),"#FFF8F0"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#30252A"),"#30252A");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,last=0,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,mouse={x:0,y:0,tx:0,ty:0,active:false},blooms=[],pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)],TAU=Math.PI*2;
function rnd(a,b){return a+Math.random()*(b-a)}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=mouse.tx=W*.5,mouse.y=mouse.ty=H*.5;if(!blooms.length)for(var i=0;i<Math.max(5,Math.round(9*density));i++)blooms.push({x:rnd(.08,.92),y:rnd(.08,.92),r:rnd(25,75)*size,a:rnd(0,TAU),spin:rnd(-1,1),c:pal[i%3],p:rnd(0,TAU)})}
function bloom(b,t){var px=b.x*W+(mouse.x-W*.5)*.025,py=b.y*H+(mouse.y-H*.5)*.018,open=.72+Math.sin(t*.00055*speed+b.p)*.18,ang=b.a+t*.0001*speed*b.spin,rad=b.r*open,c=b.c;ctx.save();ctx.translate(px,py);ctx.rotate(ang);ctx.globalAlpha=.25;for(var i=0;i<8;i++){ctx.rotate(TAU/8);ctx.fillStyle="rgba("+c.r+","+c.g+","+c.b+",.7)";ctx.beginPath();ctx.ellipse(0,-rad*.55,rad*.19,rad*.58,0,0,TAU);ctx.fill()}ctx.globalAlpha=.9;ctx.fillStyle="rgba("+c.r+","+c.g+","+c.b+",.9)";ctx.beginPath();ctx.arc(0,0,rad*.14,0,TAU);ctx.fill();ctx.restore()}
function render(t){ctx.clearRect(0,0,W,H);blooms.forEach(function(b){b.a+=.00008*speed;b.y-=.000004*speed;if(b.y<-.1)b.y=1.1;bloom(b,t)})}function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.tx=W*.5+Math.sin(t*.00015)*W*.16;mouse.ty=H*.5+Math.cos(t*.00018)*H*.1}mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;render(t);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.tx=e.clientX;mouse.ty=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.tx=e.touches[0].clientX;mouse.ty=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0);else requestAnimationFrame(step)
})();
</script></body></html>
