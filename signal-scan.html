<!DOCTYPE html>
<!--
  SIGNAL SCAN — a slow radar-style sweep line rotates across a dark field,
  briefly illuminating faint blips as it passes, cursor bends the sweep.
  --------------------------------------------------------------------------------------
  <iframe src=".../backgrounds/signal-scan.html?color=%2300FFC2&bg=%23050B0A&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color      hex, sweep/blip color        default #00FFC2
    bg         hex, background color        default #050B0A
    density    float multiplier for blips   default 1  (capped)
    speed      float multiplier for sweep   default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF

  PERF: sweep is a single pre-rendered conic-style gradient wedge sprite
  rotated via canvas transform (no per-frame gradient math). Blip count
  hard-capped at 26. Ring rendering uses plain stroke(), no shadowBlur.
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Signal Scan Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#050B0A; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{ position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none; }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 0 30px rgba(0,0,0,0.6);
    opacity:0;
    animation:reveal 1.2s ease forwards 0.2s;
  }
  @keyframes reveal{ to{ opacity:1; transform:translateY(0); } from{ opacity:0; transform:translateY(12px); } }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){ return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback; }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  var color = safeHex(getParam("color", "#00FFC2"), "#00FFC2");
  var bg = safeHex(getParam("bg", "#050B0A"), "#050B0A");
  var density = Math.min(2.5, Math.max(0.3, parseFloat(getParam("density", "1")) || 1));
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb = hexToRgb(color);
  var rgbStr = rgb.r + "," + rgb.g + "," + rgb.b;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, DPR, cx, cy, maxR;
  var sweepAngle = 0;
  var sweepSprite;
  var blips = [];
  var MAX_BLIPS = 26;
  var mouse = { x:null, y:null, active:false };

  function buildSweepSprite(radius){
    var d = radius * 2;
    var s = document.createElement("canvas");
    s.width = d; s.height = d;
    var sc = s.getContext("2d");
    // approximate a conic wedge fade using several overlaid radial slices
    var steps = 40;
    for(var i=0;i<steps;i++){
      var a0 = -((i/steps) * Math.PI/2.2);
      var alpha = (1 - i/steps) * 0.22;
      sc.beginPath();
      sc.moveTo(radius, radius);
      sc.arc(radius, radius, radius, a0, a0 - (Math.PI/2.2/steps), true);
      sc.closePath();
      sc.fillStyle = "rgba(" + rgbStr + "," + alpha + ")";
      sc.fill();
    }
    return s;
  }

  function resize(){
    DPR = Math.min(1.5, window.devicePixelRatio || 1);
    W = window.innerWidth;
    H = window.innerHeight;
    canvas.width = W * DPR;
    canvas.height = H * DPR;
    canvas.style.width = W + "px";
    canvas.style.height = H + "px";
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);

    cx = W/2; cy = H/2;
    maxR = Math.sqrt(cx*cx + cy*cy) * 1.05;
    sweepSprite = buildSweepSprite(maxR);

    var count = Math.max(8, Math.min(MAX_BLIPS, Math.round(16 * density)));
    blips = [];
    for(var i=0;i<count;i++){
      var ang = Math.random() * Math.PI * 2;
      var r = Math.sqrt(Math.random()) * maxR * 0.92;
      blips.push({
        angle: ang,
        r: r,
        x: cx + Math.cos(ang) * r,
        y: cy + Math.sin(ang) * r,
        lit: 0
      });
    }

    ctx.fillStyle = bg;
    ctx.fillRect(0, 0, W, H);
  }

  window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; }, {passive:true});
  window.addEventListener("mouseleave", function(){ mouse.active=false; });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; mouse.active=true; } }, {passive:true});

  var running = true;
  document.addEventListener("visibilitychange", function(){ running = !document.hidden; if(running) requestAnimationFrame(step); });

  function angleDiff(a, b){
    var d = (a - b) % (Math.PI*2);
    if(d < -Math.PI) d += Math.PI*2;
    if(d > Math.PI) d -= Math.PI*2;
    return d;
  }

  function step(){
    if(!running) return;

    ctx.fillStyle = "rgba(" + (parseInt(bg.slice(1,3),16)) + "," + (parseInt(bg.slice(3,5),16)) + "," + (parseInt(bg.slice(5,7),16)) + ",0.16)";
    ctx.fillRect(0, 0, W, H);

    // faint concentric rings
    ctx.strokeStyle = "rgba(" + rgbStr + ",0.08)";
    ctx.lineWidth = 1;
    for(var ring=1; ring<=3; ring++){
      ctx.beginPath();
      ctx.arc(cx, cy, (maxR/3) * ring, 0, Math.PI*2);
      ctx.stroke();
    }

    if(!reduced) sweepAngle += 0.012 * speed;

    var bendOffset = 0;
    if(mouse.active){
      var dx = mouse.x - cx, dy = mouse.y - cy;
      bendOffset = Math.atan2(dy, dx) * 0.02;
    }

    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(sweepAngle + bendOffset);
    ctx.drawImage(sweepSprite, -maxR, -maxR);
    ctx.restore();

    // light blips as the sweep passes them
    for(var i=0;i<blips.length;i++){
      var b = blips[i];
      var diff = Math.abs(angleDiff(sweepAngle, b.angle));
      if(diff < 0.15){
        b.lit = 1;
      } else {
        b.lit *= 0.965;
      }
      if(b.lit > 0.02){
        ctx.beginPath();
        ctx.arc(b.x, b.y, 2.5, 0, Math.PI*2);
        ctx.fillStyle = "rgba(" + rgbStr + "," + b.lit + ")";
        ctx.fill();
      }
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  resize();
  requestAnimationFrame(step);
})();
</script>
</body>
</html>
