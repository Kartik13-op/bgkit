<!DOCTYPE html>
<!-- @name: Line Breath @slug: line-breath @description: Fine horizontal lines expand and contract in a quiet monochrome rhythm. @tags: minimal, lines, ambient -->
<html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Line Breath</title><style>html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#101113}.stage{height:100%;position:relative;background:var(--bg);display:grid;place-items:center;overflow:hidden}.lines{width:120%;height:70%;opacity:.7;background:repeating-linear-gradient(0deg,transparent 0 13px,var(--line) 14px 15px);mask-image:linear-gradient(90deg,transparent,black 20%,black 80%,transparent);animation:breathe 10s ease-in-out infinite alternate}.center{position:absolute;width:min(32vw,360px);aspect-ratio:1;border:1px solid var(--accent);border-radius:50%;opacity:.35;box-shadow:0 0 80px var(--accent);animation:pulse 8s ease-in-out infinite alternate}.hero{position:absolute;inset:0;display:grid;place-items:center;color:var(--tc);font:500 clamp(1.5rem,4vw,3.5rem)/1.1 system-ui,sans-serif;letter-spacing:-.04em;text-align:center}.hero span{opacity:0;animation:in 1.2s ease forwards}@keyframes breathe{to{transform:scaleY(1.22) translateX(4%);opacity:.45}}@keyframes pulse{to{transform:scale(1.28);opacity:.14}}@keyframes in{to{opacity:1}from{opacity:0;transform:translateY(10px)}}@media(prefers-reduced-motion:reduce){.lines,.center{animation:none}.hero span{animation:none;opacity:1}}</style></head><body><div class="stage" style="--bg:#101113;--line:rgba(239,240,235,.2);--accent:#C8BBA8;--tc:#F1F0EB"><div class="lines"></div><div class="center"></div><div class="hero"><span id="heroText"></span></div></div><script>(function(){function p(n,d){var v=new URLSearchParams(location.search).get(n);return v===null||v===''?d:v}function h(v,d){return /^#([0-9a-f]{3}){1,2}$/i.test(v)?v:d}var s=document.querySelector('.stage');s.style.setProperty('--bg',h(p('bg','#101113'),'#101113'));s.style.setProperty('--line',p('line','rgba(239,240,235,.2)'));s.style.setProperty('--accent',h(p('color','#C8BBA8'),'#C8BBA8'));s.style.setProperty('--tc',h(p('textcolor','#F1F0EB'),'#F1F0EB'));var d=parseFloat(p('speed','1'))||1;document.querySelector('.lines').style.animationDuration=10/d+'s';document.querySelector('.center').style.animationDuration=8/d+'s';var t=p('text','');if(t)document.getElementById('heroText').textContent=t})();</script></body></html>
