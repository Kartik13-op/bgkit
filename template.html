<!DOCTYPE html>
<!--
  TEMPLATE — duplicate this file to start a new background fast.
  ================================================================
  1. Rename the file to kebab-case, e.g. "neon-waves.html", and drop it in /backgrounds.
  2. Fill in the header comment block below (used by index.html's gallery — keep it parseable).
  3. Replace the CANVAS/SVG/DOM logic in the marked section with your effect.
  4. Keep the query-param plumbing pattern: getParam/safeHex helpers + a params table in the comment.
  5. Always include: bg param, a hero text overlay, prefers-reduced-motion guard, and mobile-safe sizing.

  @name: My New Background
  @slug: my-new-background
  @description: One sentence describing the vibe/effect, shown in the gallery.
  @tags: gradient, particles, interactive   (comma separated, used for gallery filtering)

  Embed:
    <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/my-new-background.html?color=%237C5CFF&bg=%23090A0F&text=Hello"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;"
      loading="lazy"></iframe>

  Query params:
    color      hex, primary accent color     default #7C5CFF
    bg         hex, background color         default #090A0F
    speed      float multiplier for motion   default 1
    text       optional hero text overlay    default "" (none)
    textcolor  hex, hero text color          default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>My New Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ---------- BASE SCAFFOLD (keep as-is) ---------- */
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
  }
  canvas{ position:absolute; inset:0; display:block; }

  .hero{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }

  /* ---------- YOUR CUSTOM STYLES BELOW ---------- */

</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  /* ---------- SHARED PARAM HELPERS (keep as-is) ---------- */
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  /* ---------- READ PARAMS (extend as needed, keep names consistent across templates) ---------- */
  var color = safeHex(getParam("color", "#7C5CFF"), "#7C5CFF");
  var bg = safeHex(getParam("bg", "#090A0F"), "#090A0F");
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb = hexToRgb(color);
  var rgbStr = rgb.r + "," + rgb.g + "," + rgb.b;

  /* ---------- YOUR EFFECT LOGIC BELOW ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H;
  var mouse = { x:0, y:0, active:false };

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    // (re)initialize your particles/objects here, scaled by W/H and `speed`
  }

  function step(){
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    // draw your effect here, using rgbStr / rgb / color as needed

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
  }, { passive:true });
  window.addEventListener("mouseleave", function(){ mouse.active = false; });
  window.addEventListener("touchmove", function(e){
    if(e.touches[0]){ mouse.x = e.touches[0].clientX; mouse.y = e.touches[0].clientY; mouse.active = true; }
  }, { passive:true });

  resize();
  step();

  /* Always respect reduced motion: either skip requestAnimationFrame loops
     or render a single static frame instead. Example:
     if(window.matchMedia('(prefers-reduced-motion: reduce)').matches){ ... }
  */
})();
</script>
</body>
</html>
