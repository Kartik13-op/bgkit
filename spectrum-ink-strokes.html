<!DOCTYPE html>
<!--
  SPECTRUM INK STROKES
  Cursor movement lays down fading, multicolor ink strokes while ambient strokes keep the canvas alive between gestures.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/spectrum-ink-strokes.html?color1=%23FF4D9D&color2=%23FFB347&color3=%235D9CFF&bg=%230B0D16&text=Leave%20a%20trace" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Spectrum Ink Strokes"></iframe>
  Query params:
    color1     hex, first ink color                 default #FF4D9D
    color2     hex, second ink color                default #FFB347
    color3     hex, third ink color                 default #5D9CFF
    bg         hex, background color                default #0B0D16
    speed      float, fade/motion multiplier         default 1
    density    float, ambient stroke count multiplier default 1
    size       float, stroke width multiplier        default 1
    text       optional hero headline                default ""
    textcolor  hex, hero text color                  default #FFFFFF
-->
<html lang="en"><head><meta charset="UTF-8"><title>Spectrum Ink Strokes</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.5);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){function getParam(name, fallback){var v=new URLSearchParams(window.location.search).get(name);return (v === null || v === "") ? fallback : v;}function safeHex(v, fallback){return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;}function hexToRgb(hex){hex = hex.replace('#','');if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }var num = parseInt(hex,16);return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };}
var color1=safeHex(getParam("color1","#FF4D9D"),"#FF4D9D"),color2=safeHex(getParam("color2","#FFB347"),"#FFB347"),color3=safeHex(getParam("color3","#5D9CFF"),"#5D9CFF"),bg=safeHex(getParam("bg","#0B0D16"),"#0B0D16"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,last=0,strokes=[],mouse={x:0,y:0,px:0,py:0,active:false},reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)];function rnd(a,b){return a+Math.random()*(b-a)}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=mouse.px=W*.5,mouse.y=mouse.py=H*.5}function addStroke(x,y,angle,manual){strokes.push({x:x,y:y,a:angle,len:rnd(70,220),w:rnd(7,22)*size,age:0,life:manual?2.8:4.8,c:pal[Math.floor(rnd(0,3))]});if(strokes.length>Math.round(42*density))strokes.shift()}function render(t,dt){ctx.fillStyle=bg;ctx.globalAlpha=.12+dt*.0005*speed;ctx.fillRect(0,0,W,H);ctx.globalAlpha=1;ctx.globalCompositeOperation="lighter";if(!reduced&&Math.random()<dt*.0015*density)addStroke(W*.5+Math.sin(t*.0002)*W*.35,H*.5+Math.cos(t*.00017)*H*.3,rnd(0,6.28),false);strokes.forEach(function(s){s.age+=dt*.001*speed;var k=s.age/s.life,fade=Math.sin(Math.PI*Math.min(1,k)),ex=s.x+Math.cos(s.a)*s.len,ey=s.y+Math.sin(s.a)*s.len,q=s.c,g=ctx.createLinearGradient(s.x,s.y,ex,ey);g.addColorStop(0,"rgba("+q.r+","+q.g+","+q.b+",0)");g.addColorStop(.3,"rgba("+q.r+","+q.g+","+q.b+","+(fade*.65)+")");g.addColorStop(1,"rgba("+q.r+","+q.g+","+q.b+",0)");ctx.strokeStyle=g;ctx.lineWidth=s.w*(.7+fade*.4);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(s.x,s.y);ctx.quadraticCurveTo((s.x+ex)/2+Math.sin(t*.001+s.age)*24,(s.y+ey)/2+Math.cos(t*.001+s.age)*24,ex,ey);ctx.stroke()});strokes=strokes.filter(function(s){return s.age<s.life});ctx.globalCompositeOperation="source-over"}function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.x=W*.5+Math.sin(t*.0002)*W*.2;mouse.y=H*.5+Math.cos(t*.00016)*H*.15}var dx=mouse.x-mouse.px,dy=mouse.y-mouse.py;if(!reduced&&Math.sqrt(dx*dx+dy*dy)>6)addStroke(mouse.x,mouse.y,Math.atan2(dy,dx),true);mouse.px+=(mouse.x-mouse.px)*.12;mouse.py+=(mouse.y-mouse.py)*.12;render(t,dt);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)})();
</script></body></html>
