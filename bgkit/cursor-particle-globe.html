<!DOCTYPE html>
<!--
  CURSOR PARTICLE GLOBE
  ================================================================
  A colorful cloud of small particles forms a floating globe around the cursor,
  with every particle drifting and orbiting independently inside the sphere.

  Embed:
    <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/cursor-particle-globe.html?color1=%23FF5A36&color2=%234267E8&color3=%238D56D9&bg=%23FAFBFF&text=Explore"
      style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;"
      loading="lazy" title="Cursor Particle Globe"></iframe>

  Query params:
    color1     hex, warm particle color                 default #FF5A36
    color2     hex, cool particle color                 default #4267E8
    color3     hex, violet particle color               default #8D56D9
    bg         hex, background color                     default #FAFBFF
    speed      float multiplier for particle motion     default 1
    density    float multiplier for particle count      default 1
    radius     float, globe radius as viewport fraction  default 0.34
    text       optional hero text overlay                default "" (none)
    textcolor  hex, hero text color                      default #14151B
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Cursor Particle Globe</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  /* ---------- BASE SCAFFOLD (keep as-is) ---------- */
  html,body{
    margin:0;
    padding:0;
    width:100%;
    height:100%;
    overflow:hidden;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
  .stage{
    position:relative;
    width:100%;
    height:100%;
  }
  canvas{ position:absolute; inset:0; display:block; }

  .hero{
    position:absolute;
    inset:0;
    display:flex;
    align-items:center;
    justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }

  /* ---------- YOUR CUSTOM STYLES BELOW ---------- */

</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  /* ---------- SHARED PARAM HELPERS (keep as-is) ---------- */
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  /* ---------- READ PARAMS (extend as needed, keep names consistent across templates) ---------- */
  var color1 = safeHex(getParam("color1", "#FF5A36"), "#FF5A36");
  var color2 = safeHex(getParam("color2", "#4267E8"), "#4267E8");
  var color3 = safeHex(getParam("color3", "#8D56D9"), "#8D56D9");
  var bg = safeHex(getParam("bg", "#FAFBFF"), "#FAFBFF");
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var density = parseFloat(getParam("density", "1")) || 1;
  var radiusRatio = parseFloat(getParam("radius", "0.34")) || 0.34;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#14151B"), "#14151B");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb1 = hexToRgb(color1);
  var rgb2 = hexToRgb(color2);
  var rgb3 = hexToRgb(color3);
  var rgbStr = rgb1.r + "," + rgb1.g + "," + rgb1.b;

  /* ---------- YOUR EFFECT LOGIC BELOW ---------- */
  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, dpr, globeRadius;
  var reduced = window.matchMedia("(prefers-reduced-motion: reduce)").matches;
  var pointer = { x:0, y:0, tx:0, ty:0, active:false };
  var particles = [], backdropDust = [], last = 0;
  var palette = [rgb1, rgb2, rgb3];
  var TAU = Math.PI * 2;

  function random(min,max){ return min + Math.random() * (max-min); }
  function resize(){
    W = window.innerWidth; H = window.innerHeight;
    dpr = Math.min(window.devicePixelRatio || 1, 2);
    canvas.width = Math.floor(W*dpr); canvas.height = Math.floor(H*dpr);
    canvas.style.width = W + "px"; canvas.style.height = H + "px";
    ctx.setTransform(dpr,0,0,dpr,0,0);
    globeRadius = Math.min(W,H) * Math.max(0.16, Math.min(0.6, radiusRatio));
    if(!pointer.active){
      pointer.x = pointer.tx = W*0.5;
      pointer.y = pointer.ty = H*0.51;
    } else {
      pointer.tx = Math.max(-globeRadius*0.2, Math.min(W+globeRadius*0.2,pointer.tx));
      pointer.ty = Math.max(-globeRadius*0.2, Math.min(H+globeRadius*0.2,pointer.ty));
    }
    if(!particles.length){
      var count = Math.max(60, Math.round(260 * Math.max(0.3, Math.min(2.5,density))));
      for(var i=0;i<count;i++){
        var phi = Math.asin(random(-1,1));
        particles.push({
          theta:random(0,TAU), phi:phi, radius:random(0.78,1.18),
          size:random(0.7,2.4), length:random(2,7),
          thetaSpeed:random(-0.0007,0.0007), phiSpeed:random(-0.00022,0.00022),
          wobble:random(0.00015,0.0005), phase:random(0,TAU),
          flow:random(0.00008,0.00022), state:"in",
          color:palette[i%palette.length], alpha:random(0.38,0.92), opacity:random(0.2,0.9),
          angle:random(0,TAU), targetAngle:0, enabled:false,
          sx:0, sy:0, depth:0
        });
      }
      var dustCount = Math.max(45, Math.round(105 * Math.max(0.3, Math.min(2.5,density))));
      for(var d=0;d<dustCount;d++){
        backdropDust.push({
          x:random(0,W), y:random(0,H), size:random(0.35,1.35),
          vx:random(-0.012,0.012), vy:random(-0.018,0.018),
          alpha:random(0.035,0.16), phase:random(0,TAU),
          color:palette[d%palette.length]
        });
      }
    }
  }
  function drawBackdrop(time,dt){
    var driftX = Math.sin(time*0.00013)*W*0.035;
    var driftY = Math.cos(time*0.00011)*H*0.025;
    var washes = [
      {x:pointer.x-globeRadius*0.72+driftX,y:pointer.y-globeRadius*0.48+driftY,r:globeRadius*1.5,c:rgb1},
      {x:pointer.x+globeRadius*0.82-driftX,y:pointer.y+globeRadius*0.34-driftY,r:globeRadius*1.65,c:rgb2},
      {x:pointer.x+driftX*0.5,y:pointer.y-globeRadius*0.1,r:globeRadius*1.8,c:rgb3}
    ];
    washes.forEach(function(w){
      var wash=ctx.createRadialGradient(w.x,w.y,0,w.x,w.y,w.r);
      wash.addColorStop(0,"rgba("+w.c.r+","+w.c.g+","+w.c.b+",0.075)");
      wash.addColorStop(0.58,"rgba("+w.c.r+","+w.c.g+","+w.c.b+",0.026)");
      wash.addColorStop(1,"rgba("+w.c.r+","+w.c.g+","+w.c.b+",0)");
      ctx.fillStyle=wash; ctx.beginPath(); ctx.arc(w.x,w.y,w.r,0,TAU); ctx.fill();
    });
    backdropDust.forEach(function(d){
      if(!reduced){
        d.x += d.vx*dt*speed; d.y += d.vy*dt*speed;
        if(d.x < -4) d.x=W+4; if(d.x > W+4) d.x=-4;
        if(d.y < -4) d.y=H+4; if(d.y > H+4) d.y=-4;
      }
      var pulse=d.alpha*(0.72+Math.sin(time*0.001+d.phase)*0.28), c=d.color;
      ctx.fillStyle="rgba("+c.r+","+c.g+","+c.b+","+pulse+")";
      ctx.beginPath(); ctx.arc(d.x,d.y,d.size,0,TAU); ctx.fill();
    });
  }
  function updateParticle(p, time, dt, globeScale){
    p.theta += p.thetaSpeed * dt * speed;
    p.phi += p.phiSpeed * dt * speed;
    p.phi += Math.sin(time*p.wobble + p.phase) * 0.00008 * dt * speed;
    if(p.state === "in"){
      p.radius -= p.flow * dt * speed;
      p.opacity += (0.92-p.opacity) * Math.min(1,dt*0.004);
      if(p.radius < 0.7){ p.radius=0.7; p.state="out"; }
    } else {
      p.radius += p.flow * dt * speed * 1.18;
      if(p.radius > 1.02){ p.opacity -= dt*0.00075*speed; }
      if(p.radius > 1.22 || p.opacity <= 0){
        p.theta = random(0,TAU);
        p.phi = Math.asin(random(-1,1));
        p.radius = random(1.18,1.34);
        p.flow = random(0.00008,0.00022);
        p.opacity = 0;
        p.state = "in";
        p.color = palette[Math.floor(random(0,palette.length))];
      }
    }
    if(p.phi > 1.45 || p.phi < -1.45) p.phiSpeed *= -1;
    var cosPhi = Math.cos(p.phi);
    var localX = cosPhi * Math.cos(p.theta) * p.radius;
    var localY = Math.sin(p.phi) * p.radius;
    var depth = Math.sin(p.theta) * cosPhi * p.radius;
    var breathing = 1 + Math.sin(time*0.00042 + p.phase*0.7) * 0.055;
    p.sx = pointer.x + localX * globeScale * breathing;
    p.sy = pointer.y + localY * globeScale * 0.84 * breathing;
    p.depth = depth;
    var distanceFromCursor = Math.sqrt((p.sx-pointer.x)*(p.sx-pointer.x) + (p.sy-pointer.y)*(p.sy-pointer.y));
    p.enabled = p.radius <= 1.08 && distanceFromCursor <= globeScale*1.08 && p.opacity > 0.02;
    p.targetAngle = Math.atan2(pointer.y-p.sy,pointer.x-p.sx);
    var turn = p.targetAngle-p.angle;
    while(turn > Math.PI) turn -= TAU;
    while(turn < -Math.PI) turn += TAU;
    p.angle += turn * Math.min(1,dt*0.012);
  }
  function drawParticle(p, time, dt){
    if(!p.enabled) return;
    var depth01 = (p.depth + 1.13) / 2.26;
    var scale = 0.58 + depth01*0.68;
    var px = p.sx, py = p.sy;
    var c = p.color;
    var alpha = p.alpha * p.opacity * (0.16 + depth01*0.84);
    var wobbleX = Math.sin(time*0.0012+p.phase) * 1.5;
    var wobbleY = Math.cos(time*0.0009+p.phase*1.7) * 1.5;
    var len = p.length * scale + Math.min(5, Math.abs(p.thetaSpeed)*dt*1000);
    ctx.save();
    ctx.translate(px+wobbleX,py+wobbleY);
    ctx.rotate(p.angle + Math.sin(time*0.001+p.phase)*0.04);
    ctx.fillStyle = "rgba("+c.r+","+c.g+","+c.b+","+alpha+")";
    ctx.beginPath();
    ctx.roundRect(-len*0.5,-p.size*scale*0.5,len,p.size*scale, p.size*scale*0.5);
    ctx.fill();
    ctx.restore();
  }
  function render(time, dt){
    ctx.clearRect(0,0,W,H);
    ctx.globalCompositeOperation = "source-over";
    drawBackdrop(time,dt);
    ctx.globalCompositeOperation = "lighter";
    var globeScale = globeRadius * (1 + Math.sin(time*0.00042)*0.045);
    var glow = ctx.createRadialGradient(pointer.x,pointer.y,globeScale*0.05,pointer.x,pointer.y,globeScale*1.18);
    glow.addColorStop(0,"rgba(255,255,255,0.18)");
    glow.addColorStop(0.72,"rgba(255,255,255,0.04)");
    glow.addColorStop(1,"rgba(255,255,255,0)");
    ctx.fillStyle = glow; ctx.beginPath(); ctx.arc(pointer.x,pointer.y,globeScale*1.2,0,TAU); ctx.fill();
    particles.forEach(function(p){ updateParticle(p,time,dt,globeScale); });
    particles.sort(function(a,b){ return a.depth-b.depth; });
    particles.forEach(function(p){ drawParticle(p,time,dt); });
  }
  function step(time){
    var dt = Math.min(40, time-last || 16); last=time;
    if(!pointer.active){
      pointer.tx = W*0.5 + Math.sin(time*0.00019)*W*0.1;
      pointer.ty = H*0.51 + Math.cos(time*0.00017)*H*0.08;
    }
    pointer.x += (pointer.tx-pointer.x) * Math.min(1,dt*0.008);
    pointer.y += (pointer.ty-pointer.y) * Math.min(1,dt*0.008);
    render(time,dt);
    if(!reduced) requestAnimationFrame(step);
  }
  function move(x,y){
    pointer.tx=x; pointer.ty=y; pointer.active=true;
    if(reduced){
      pointer.x=x; pointer.y=y; render(performance.now(),16);
    }
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){ move(e.clientX,e.clientY); }, { passive:true });
  window.addEventListener("mouseleave", function(){ pointer.active=false; }, { passive:true });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); }, { passive:true });
  window.addEventListener("touchstart", function(e){ if(e.touches[0]) move(e.touches[0].clientX,e.touches[0].clientY); }, { passive:true });

  resize();
  if(reduced) render(0,16);
  else requestAnimationFrame(step);
})();
</script>
</body>
</html>
