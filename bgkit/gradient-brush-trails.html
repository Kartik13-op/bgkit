<!DOCTYPE html>
<!--
  GRADIENT BRUSH TRAILS
  Broad translucent brush marks drift through a color field, bending and stretching toward the cursor.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/gradient-brush-trails.html?color1=%23FF6B8A&color2=%23FFB86B&color3=%237A7CFF&bg=%230D1020&text=Paint%20the%20moment" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Gradient Brush Trails"></iframe>
  Query params:
    color1     hex, first brush color               default #FF6B8A
    color2     hex, second brush color              default #FFB86B
    color3     hex, third brush color               default #7A7CFF
    bg         hex, background color                default #0D1020
    speed      float, animation multiplier           default 1
    density    float, brush count multiplier         default 1
    size       float, brush width multiplier         default 1
    text       optional hero headline                default ""
    textcolor  hex, hero text color                  default #FFFFFF

<html lang="en"><head><meta charset="UTF-8"><title>Gradient Brush Trails</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.45);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){
function getParam(name, fallback){var v=new URLSearchParams(window.location.search).get(name);return(v===null||v==="")?fallback:v}function safeHex(v,fallback){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:fallback}function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(function(c){return c+c}).join('');var num=parseInt(hex,16);return{r:(num>>16)&255,g:(num>>8)&255,b:num&255}}
var color1=safeHex(getParam("color1","#FF6B8A"),"#FF6B8A"),color2=safeHex(getParam("color2","#FFB86B"),"#FFB86B"),color3=safeHex(getParam("color3","#7A7CFF"),"#7A7CFF"),bg=safeHex(getParam("bg","#0D1020"),"#0D1020"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,last=0,brushes=[],mouse={x:0,y:0,active:false},reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)];function rnd(a,b){return a+Math.random()*(b-a)}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=W*.5,mouse.y=H*.5;if(!brushes.length)for(var i=0;i<Math.max(12,Math.round(32*density));i++)brushes.push({x:rnd(0,W),y:rnd(0,H),a:rnd(0,6.28),len:rnd(120,300),w:rnd(8,26)*size,v:rnd(.018,.08),p:rnd(0,6.28),c:pal[i%3]})}function draw(b,t,dt){var dx=mouse.x-b.x,dy=mouse.y-b.y,dist=Math.sqrt(dx*dx+dy*dy)||1,force=Math.max(0,1-dist/480);b.a+=Math.sin(t*.0004+b.p)*.0004*speed;b.x+=Math.cos(b.a)*b.v*dt*speed+dx/dist*force*dt*.035;b.y+=Math.sin(b.a)*b.v*dt*speed+dy/dist*force*dt*.035;if(b.x<-b.len)b.x=W+b.len;if(b.x>W+b.len)b.x=-b.len;if(b.y<-b.len)b.y=H+b.len;if(b.y>H+b.len)b.y=-b.len;var ex=b.x+Math.cos(b.a)*b.len,ey=b.y+Math.sin(b.a)*b.len,g=ctx.createLinearGradient(b.x,b.y,ex,ey),q=b.c;g.addColorStop(0,"rgba("+q.r+","+q.g+","+q.b+",0)");g.addColorStop(.22,"rgba("+q.r+","+q.g+","+q.b+",.3)");g.addColorStop(.72,"rgba("+q.r+","+q.g+","+q.b+",.8)");g.addColorStop(1,"rgba(255,255,255,0)");ctx.strokeStyle=g;ctx.lineWidth=b.w*(.7+force*.8);ctx.lineCap="round";ctx.beginPath();ctx.moveTo(b.x,b.y);ctx.quadraticCurveTo((b.x+ex)/2+Math.sin(t*.001+b.p)*35,(b.y+ey)/2+Math.cos(t*.001+b.p)*35,ex,ey);ctx.stroke()}function render(t,dt){ctx.clearRect(0,0,W,H);var g=ctx.createRadialGradient(mouse.x,mouse.y,0,mouse.x,mouse.y,Math.max(W,H)*.75);g.addColorStop(0,"rgba(110,90,255,.12)");g.addColorStop(1,"rgba(0,0,0,0)");ctx.fillStyle=g;ctx.fillRect(0,0,W,H);ctx.globalCompositeOperation="lighter";brushes.forEach(function(b){draw(b,t,dt)});ctx.globalCompositeOperation="source-over"}function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.x=W*.5+Math.sin(t*.0002)*W*.18;mouse.y=H*.5+Math.cos(t*.00016)*H*.12}render(t,dt);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.x=e.clientX;mouse.y=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.x=e.touches[0].clientX;mouse.y=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)})();
</script></body></html>
