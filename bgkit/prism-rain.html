<!DOCTYPE html>
<!--
  PRISM RAIN
  Slanted prismatic streaks fall through a quiet sky, accelerating and bending when the cursor passes through them.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/prism-rain.html?color1=%23FF6B6B&color2=%23FFD166&color3=%235CA9FF&bg=%2312192A&text=After%20the%20rain" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Prism Rain"></iframe>
  Query params:
    color1     hex, warm rain color                default #FF6B6B
    color2     hex, gold rain color                default #FFD166
    color3     hex, blue rain color                default #5CA9FF
    bg         hex, background color               default #12192A
    speed      float, animation multiplier          default 1
    density    float, streak count multiplier       default 1
    size       float, streak length multiplier      default 1
    text       optional hero headline               default ""
    textcolor  hex, hero text color                 default #FFFFFF
-->
<html lang="en"><head><meta charset="UTF-8"><title>Prism Rain</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.5);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){function getParam(name,fallback){var v=new URLSearchParams(window.location.search).get(name);return(v===null||v==="")?fallback:v}function safeHex(v,fallback){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:fallback}function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(function(c){return c+c}).join('');var num=parseInt(hex,16);return{r:(num>>16)&255,g:(num>>8)&255,b:num&255}}
var color1=safeHex(getParam("color1","#FF6B6B"),"#FF6B6B"),color2=safeHex(getParam("color2","#FFD166"),"#FFD166"),color3=safeHex(getParam("color3","#5CA9FF"),"#5CA9FF"),bg=safeHex(getParam("bg","#12192A"),"#12192A"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,last=0,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,mouse={x:0,y:0,tx:0,ty:0,active:false},drops=[],pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)];function rnd(a,b){return a+Math.random()*(b-a)}function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=mouse.tx=W*.5,mouse.y=mouse.ty=H*.5;if(!drops.length)for(var i=0;i<Math.max(35,Math.round(100*density));i++)drops.push({x:rnd(0,W),y:rnd(0,H),l:rnd(16,48)*size,v:rnd(.08,.24),w:rnd(.6,1.8),c:pal[i%3],p:rnd(0,6.28)})}
function render(t,dt){ctx.clearRect(0,0,W,H);drops.forEach(function(q){if(!reduced){q.y+=q.v*dt*speed;q.x+=Math.sin(t*.0007+q.p)*.06*dt*speed}if(q.y>H+60){q.y=-60;q.x=rnd(0,W)}var dx=mouse.x-q.x,dy=mouse.y-q.y,dist=Math.sqrt(dx*dx+dy*dy)||1,influence=Math.max(0,1-dist/260);q.x-=dx/dist*influence*dt*.08;var c=q.c,alpha=.18+influence*.48;ctx.strokeStyle="rgba("+c.r+","+c.g+","+c.b+","+alpha+")";ctx.lineWidth=q.w;ctx.lineCap="round";ctx.beginPath();ctx.moveTo(q.x,q.y);ctx.lineTo(q.x-8-influence*18,q.y-q.l*(.7+influence*.4));ctx.stroke()})}
function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.tx=W*.5+Math.sin(t*.00013)*W*.18;mouse.ty=H*.5+Math.cos(t*.0002)*H*.16}mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;render(t,dt);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.tx=e.clientX;mouse.ty=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.tx=e.touches[0].clientX;mouse.ty=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)
})();
</script></body></html>
