<!DOCTYPE html>
<!--
  RIBBON FLOW — flowing silk-like curves drifting across the canvas, cursor-reactive
  ---------------------------------------------------------------------------------------
  <iframe src=".../backgrounds/ribbon-flow.html?color1=%23FF6B6B&color2=%234ECDC4&bg=%230A0E14&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color1     hex, ribbon color A          default #FF6B6B
    color2     hex, ribbon color B          default #4ECDC4
    bg         hex, background color        default #0A0E14
    count      int, number of ribbons       default 6
    speed      float multiplier for motion  default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Ribbon Flow Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#0A0E14; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function lerp(a,b,t){ return a+(b-a)*t; }

  var color1 = safeHex(getParam("color1", "#FF6B6B"), "#FF6B6B");
  var color2 = safeHex(getParam("color2", "#4ECDC4"), "#4ECDC4");
  var bg = safeHex(getParam("bg", "#0A0E14"), "#0A0E14");
  var ribbonCount = parseInt(getParam("count", "6"), 10) || 6;
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb1 = hexToRgb(color1), rgb2 = hexToRgb(color2);

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, ribbons = [];
  var mouse = { x:0, y:0 };
  var t = 0;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    mouse.x = W/2; mouse.y = H/2;
    ribbons = [];
    for(var i=0;i<ribbonCount;i++){
      var mix = i / Math.max(1,ribbonCount-1);
      ribbons.push({
        offsetY: (i / ribbonCount) * H,
        amp: 60 + Math.random()*80,
        freq: 0.002 + Math.random()*0.002,
        phase: Math.random()*Math.PI*2,
        speedMul: 0.5 + Math.random()*0.8,
        width: 1.5 + Math.random()*2,
        r: Math.round(lerp(rgb1.r, rgb2.r, mix)),
        g: Math.round(lerp(rgb1.g, rgb2.g, mix)),
        b: Math.round(lerp(rgb1.b, rgb2.b, mix))
      });
    }
  }

  function step(){
    ctx.fillStyle = bg;
    ctx.globalAlpha = 1;
    ctx.fillRect(0,0,W,H);

    t += 0.6 * speed;

    ribbons.forEach(function(rb, idx){
      ctx.beginPath();
      var mouseInfluence = (mouse.y - H/2) * 0.08;
      for(var x=0; x<=W; x+=10){
        var y = rb.offsetY
          + Math.sin(x*rb.freq + t*0.008*rb.speedMul + rb.phase) * rb.amp
          + Math.sin(x*rb.freq*2.3 + t*0.004*rb.speedMul) * (rb.amp*0.3)
          + mouseInfluence * Math.sin(idx*0.7);
        if(x===0) ctx.moveTo(x,y); else ctx.lineTo(x,y);
      }
      var grad = ctx.createLinearGradient(0,0,W,0);
      grad.addColorStop(0, "rgba(" + rb.r + "," + rb.g + "," + rb.b + ",0)");
      grad.addColorStop(0.5, "rgba(" + rb.r + "," + rb.g + "," + rb.b + ",0.55)");
      grad.addColorStop(1, "rgba(" + rb.r + "," + rb.g + "," + rb.b + ",0)");
      ctx.strokeStyle = grad;
      ctx.lineWidth = rb.width;
      ctx.shadowColor = "rgba(" + rb.r + "," + rb.g + "," + rb.b + ",0.5)";
      ctx.shadowBlur = 8;
      ctx.stroke();
      ctx.shadowBlur = 0;
    });

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; }, {passive:true});
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; } }, {passive:true});

  resize();
  step();
})();
</script>
</body>
</html>
