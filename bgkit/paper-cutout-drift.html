<!DOCTYPE html>
<!--
  PAPER CUTOUT DRIFT
  Layered paper-like shapes float through a warm editorial space, shifting their shadows with the cursor.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/paper-cutout-drift.html?color1=%23F08A5D&color2=%23B83B5E&color3=%236C5B7B&bg=%23F7F1E8&text=Shape%20your%20story" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Paper Cutout Drift"></iframe>
  Query params:
    color1     hex, main paper color              default #F08A5D
    color2     hex, second paper color            default #B83B5E
    color3     hex, shadow accent                 default #6C5B7B
    bg         hex, background color              default #F7F1E8
    speed      float, animation multiplier        default 1
    density    float, shape count multiplier      default 1
    size       float, shape size multiplier       default 1
    text       optional hero headline             default ""
    textcolor  hex, hero text color               default #24202A
-->
<html lang="en"><head><meta charset="UTF-8"><title>Paper Cutout Drift</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
  html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}
  .stage{position:relative;width:100%;height:100%} canvas{position:absolute;inset:0;display:block}
  .hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}
  .hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.18);opacity:0;animation:reveal 1.4s ease forwards .3s}
  @keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  var color1=safeHex(getParam("color1","#F08A5D"),"#F08A5D"), color2=safeHex(getParam("color2","#B83B5E"),"#B83B5E"), color3=safeHex(getParam("color3","#6C5B7B"),"#6C5B7B"), bg=safeHex(getParam("bg","#F7F1E8"),"#F7F1E8"), speed=parseFloat(getParam("speed","1"))||1, density=parseFloat(getParam("density","1"))||1, size=parseFloat(getParam("size","1"))||1, text=getParam("text",""), textColor=safeHex(getParam("textcolor","#24202A"),"#24202A");
  document.body.style.background=bg; document.getElementById("heroText").style.color=textColor; if(text) document.getElementById("heroText").textContent=text;
  var canvas=document.getElementById("c"),ctx=canvas.getContext("2d"),W,H,dpr,mouse={x:0,y:0,tx:0,ty:0,active:false},items=[],last=0,reduced=window.matchMedia("(prefers-reduced-motion: reduce)").matches,pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)],TAU=Math.PI*2;
  function rnd(a,b){return a+Math.random()*(b-a)}
  function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);canvas.width=W*dpr;canvas.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=mouse.tx=W*.5,mouse.y=mouse.ty=H*.5;if(!items.length){for(var i=0;i<Math.max(9,Math.round(15*density));i++)items.push({x:rnd(-.1,1.1),y:rnd(-.1,1.1),s:rnd(.55,1.25)*size,a:rnd(0,TAU),r:rnd(30,105),rot:rnd(-1,1),c:pal[i%3],p:rnd(0,TAU)})}}
  function poly(it,t){var x=it.x*W+(mouse.x-W*.5)*it.r*.006,y=it.y*H+(mouse.y-H*.5)*it.r*.004,rad=it.r*it.s,w=rad*(.65+Math.sin(t*.0005+it.p)*.22),h=rad*(.8+Math.cos(t*.0004+it.p)*.2),ang=it.a+t*.00012*speed*it.rot;var c=it.c;ctx.save();ctx.translate(x,y);ctx.rotate(ang);ctx.shadowColor="rgba("+c.r+","+c.g+","+c.b+",.25)";ctx.shadowBlur=24;ctx.shadowOffsetX=10;ctx.shadowOffsetY=16;ctx.fillStyle="rgba("+c.r+","+c.g+","+c.b+",.82)";ctx.beginPath();ctx.moveTo(-w,-h*.2);ctx.lineTo(-w*.15,-h);ctx.lineTo(w,h*.55);ctx.lineTo(w*.25,h);ctx.lineTo(-w*.75,h*.4);ctx.closePath();ctx.fill();ctx.restore()}
  function render(t,dt){ctx.clearRect(0,0,W,H);ctx.fillStyle="rgba(255,255,255,.08)";ctx.fillRect(0,0,W,H);items.forEach(function(it){it.y-=dt*.000006*speed*it.rot;if(it.y<-.2)it.y=1.15;poly(it,t)})}
  function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.tx=W*.5+Math.sin(t*.0002)*W*.08;mouse.ty=H*.5+Math.cos(t*.00017)*H*.07}mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;render(t,dt);if(!reduced)requestAnimationFrame(step)}
  addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.tx=e.clientX;mouse.ty=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.tx=e.touches[0].clientX;mouse.ty=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0,16);else requestAnimationFrame(step)
})();
</script></body></html>
