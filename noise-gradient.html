<!DOCTYPE html>
<!--
  NOISE GRADIENT — animated Perlin-like noise gradient that slowly shifts, subtle texture
  -----------------------------------------------------------------------------------------
  @name: Noise Gradient
  @slug: noise-gradient
  @description: A slowly morphing noise-based gradient field with gentle color transitions.
  @tags: gradient, texture, ambient

  Query params:
    color1     hex, primary color           default #6366F1
    color2     hex, secondary color         default #EC4899
    bg         hex, base background         default #0F0F1A
    speed      float multiplier             default 1
    scale      float, noise zoom            default 1
    text       optional hero text           default ""
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Noise Gradient Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center; pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem,5vw,4rem); font-weight:600; letter-spacing:-0.02em;
    text-align:center; padding:0 1rem; text-shadow:0 4px 30px rgba(0,0,0,0.5);
    opacity:0; animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{ from{opacity:0;transform:translateY(12px)} to{opacity:1;transform:translateY(0)} }
</style>
</head>
<body>
<div class="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(n,f){var v=new URLSearchParams(location.search).get(n);return v===null||v===""?f:v}
  function safeHex(v,f){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:f}
  function hexToRgb(h){h=h.replace('#','');if(h.length===3)h=h[0]+h[0]+h[1]+h[1]+h[2]+h[2];var n=parseInt(h,16);return[(n>>16)&255,(n>>8)&255,n&255]}

  var c1=hexToRgb(safeHex(getParam("color1","#6366F1"),"#6366F1"));
  var c2=hexToRgb(safeHex(getParam("color2","#EC4899"),"#EC4899"));
  var bgHex=safeHex(getParam("bg","#0F0F1A"),"#0F0F1A");
  var bgRgb=hexToRgb(bgHex);
  var speed=parseFloat(getParam("speed","1"))||1;
  var scale=parseFloat(getParam("scale","1"))||1;
  var text=getParam("text","");
  var textColor=safeHex(getParam("textcolor","#FFFFFF"),"#FFFFFF");

  document.body.style.background=bgHex;
  document.getElementById("heroText").style.color=textColor;
  if(text) document.getElementById("heroText").textContent=text;

  // Simple 2D noise (value noise with smooth interpolation)
  var perm=new Uint8Array(512);
  for(var i=0;i<256;i++) perm[i]=i;
  for(var i=255;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=perm[i];perm[i]=perm[j];perm[j]=t;}
  for(var i=0;i<256;i++) perm[i+256]=perm[i];

  function fade(t){return t*t*t*(t*(t*6-15)+10)}
  function lerp(a,b,t){return a+(b-a)*t}
  function grad(hash,x,y){var h=hash&3;return((h&1)?-x:x)+((h&2)?-y:y)}
  function noise(x,y){
    var xi=Math.floor(x)&255, yi=Math.floor(y)&255;
    var xf=x-Math.floor(x), yf=y-Math.floor(y);
    var u=fade(xf), v=fade(yf);
    var aa=perm[perm[xi]+yi], ab=perm[perm[xi]+yi+1];
    var ba=perm[perm[xi+1]+yi], bb=perm[perm[xi+1]+yi+1];
    return lerp(lerp(grad(aa,xf,yf),grad(ba,xf-1,yf),u),
                lerp(grad(ab,xf,yf-1),grad(bb,xf-1,yf-1),u),v);
  }

  var canvas=document.getElementById("c");
  var ctx=canvas.getContext("2d");
  var W,H,imgData;
  var time=0;
  var STEP=4; // render every Nth pixel for performance

  function resize(){
    W=canvas.width=window.innerWidth;
    H=canvas.height=window.innerHeight;
    imgData=ctx.createImageData(W,H);
  }

  function step(){
    var d=imgData.data;
    for(var y=0;y<H;y+=STEP){
      for(var x=0;x<W;x+=STEP){
        var nx=x/(W*0.8)*scale;
        var ny=y/(H*0.8)*scale;
        var n1=noise(nx+time*0.3,ny+time*0.2)*0.5+0.5;
        var n2=noise(nx*1.5-time*0.15,ny*1.5+time*0.25)*0.5+0.5;
        var blend=n1*0.6+n2*0.4;
        var intensity=blend*0.55; // keep it subtle so text reads well

        var r=bgRgb[0]+intensity*(c1[0]*n1+c2[0]*(1-n1)-bgRgb[0]);
        var g=bgRgb[1]+intensity*(c1[1]*n1+c2[1]*(1-n1)-bgRgb[1]);
        var b=bgRgb[2]+intensity*(c1[2]*n1+c2[2]*(1-n1)-bgRgb[2]);

        // fill the STEP×STEP block
        for(var dy=0;dy<STEP&&y+dy<H;dy++){
          for(var dx=0;dx<STEP&&x+dx<W;dx++){
            var idx=((y+dy)*W+(x+dx))*4;
            d[idx]=r; d[idx+1]=g; d[idx+2]=b; d[idx+3]=255;
          }
        }
      }
    }
    ctx.putImageData(imgData,0,0);
    time+=0.003*speed;
    requestAnimationFrame(step);
  }

  window.addEventListener("resize",resize,{passive:true});
  resize();
  if(window.matchMedia('(prefers-reduced-motion:reduce)').matches){
    step(); // render one frame
  } else {
    step();
  }
})();
</script>
</body>
</html>
