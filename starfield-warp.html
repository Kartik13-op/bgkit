<!DOCTYPE html>
<!--
  STARFIELD WARP — parallax starfield that streaks into warp-speed on hover/click
  -----------------------------------------------------------------------------------
  <iframe src=".../backgrounds/starfield-warp.html?color=%23FFFFFF&bg=%23000010&density=1&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color      hex, star color              default #FFFFFF
    bg         hex, background color        default #000010
    density    float multiplier for count   default 1
    speed      float multiplier for drift   default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Starfield Warp Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; background:#000010; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; cursor:pointer; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 0 30px rgba(0,0,0,0.7);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }
  .hint{
    position:absolute;
    bottom:24px; left:50%;
    transform:translateX(-50%);
    color:rgba(255,255,255,0.4);
    font-size:12px;
    letter-spacing:0.08em;
    text-transform:uppercase;
    pointer-events:none;
    font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif;
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
  <div class="hint" id="hint">hold click / tap to warp</div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }

  var color = safeHex(getParam("color", "#FFFFFF"), "#FFFFFF");
  var bg = safeHex(getParam("bg", "#000010"), "#000010");
  var density = parseFloat(getParam("density", "1")) || 1;
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var rgb = hexToRgb(color);
  var rgbStr = rgb.r + "," + rgb.g + "," + rgb.b;

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H, cx, cy, stars = [];
  var warp = 0; // 0 = normal drift, 1 = full warp
  var warpTarget = 0;

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    cx = W/2; cy = H/2;
    var count = Math.floor(500 * density);
    stars = [];
    for(var i=0;i<count;i++){
      stars.push(makeStar(true));
    }
  }

  function makeStar(initial){
    return {
      x: (Math.random()-0.5) * W,
      y: (Math.random()-0.5) * H,
      z: initial ? Math.random()*W : W,
      pz: 0
    };
  }

  function step(){
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    warp += (warpTarget - warp) * 0.05;
    var baseSpeed = (2 + warp*40) * speed;

    for(var i=0;i<stars.length;i++){
      var s = stars[i];
      s.pz = s.z;
      s.z -= baseSpeed;
      if(s.z < 1){
        stars[i] = makeStar(false);
        continue;
      }

      var sx = (s.x / s.z) * W + cx;
      var sy = (s.y / s.z) * W + cy;
      var px = (s.x / s.pz) * W + cx;
      var py = (s.y / s.pz) * W + cy;

      var r = Math.max(0.4, (1 - s.z/W) * 2.2);
      var op = Math.min(1, (1 - s.z/W) * 1.4);

      ctx.strokeStyle = "rgba(" + rgbStr + "," + op + ")";
      ctx.lineWidth = r;
      ctx.beginPath();
      ctx.moveTo(px, py);
      ctx.lineTo(sx, sy);
      ctx.stroke();
    }

    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousedown", function(){ warpTarget = 1; document.getElementById("hint").style.opacity = 0; });
  window.addEventListener("mouseup", function(){ warpTarget = 0; });
  window.addEventListener("touchstart", function(){ warpTarget = 1; document.getElementById("hint").style.opacity = 0; }, {passive:true});
  window.addEventListener("touchend", function(){ warpTarget = 0; });

  resize();
  step();
})();
</script>
</body>
</html>
