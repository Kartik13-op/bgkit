<!DOCTYPE html>
<!--
  TOPOGRAPHIC BREATH
  Layered contour lines slowly breathe like a living landscape, bending around the cursor and touch point.
  Embed: <iframe src="https://kartik13-op.github.io/bgkit/backgrounds/topographic-breath.html?color1=%23D96C75&color2=%23E4A853&color3=%2376A89A&bg=%23F3EEE5&text=Find%20your%20level" style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy" title="Topographic Breath"></iframe>
  Query params:
    color1     hex, primary contour color          default #D96C75
    color2     hex, secondary contour color        default #E4A853
    color3     hex, tertiary contour color         default #76A89A
    bg         hex, background color               default #F3EEE5
    speed      float, animation multiplier          default 1
    density    float, contour count multiplier      default 1
    size       float, contour spacing multiplier    default 1
    text       optional hero headline              default ""
    textcolor  hex, hero text color                default #27302D
-->
<html lang="en"><head><meta charset="UTF-8"><title>Topographic Breath</title><meta name="viewport" content="width=device-width, initial-scale=1"><style>
html,body{margin:0;padding:0;width:100%;height:100%;overflow:hidden;font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif}.stage{position:relative;width:100%;height:100%}canvas{position:absolute;inset:0;display:block}.hero{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;pointer-events:none}.hero span{font-size:clamp(1.8rem,5vw,4rem);font-weight:600;letter-spacing:-.02em;text-align:center;padding:0 1rem;text-shadow:0 4px 30px rgba(0,0,0,.12);opacity:0;animation:reveal 1.4s ease forwards .3s}@keyframes reveal{to{opacity:1;transform:translateY(0)}from{opacity:0;transform:translateY(12px)}}
</style></head><body><div class="stage" id="stage"><canvas id="c"></canvas><div class="hero"><span id="heroText"></span></div></div><script>
(function(){function getParam(name,fallback){var v=new URLSearchParams(window.location.search).get(name);return(v===null||v==="")?fallback:v}function safeHex(v,fallback){return/^#([0-9A-Fa-f]{3}){1,2}$/.test(v)?v:fallback}function hexToRgb(hex){hex=hex.replace('#','');if(hex.length===3)hex=hex.split('').map(function(c){return c+c}).join('');var num=parseInt(hex,16);return{r:(num>>16)&255,g:(num>>8)&255,b:num&255}}
var color1=safeHex(getParam("color1","#D96C75"),"#D96C75"),color2=safeHex(getParam("color2","#E4A853"),"#E4A853"),color3=safeHex(getParam("color3","#76A89A"),"#76A89A"),bg=safeHex(getParam("bg","#F3EEE5"),"#F3EEE5"),speed=parseFloat(getParam("speed","1"))||1,density=parseFloat(getParam("density","1"))||1,size=parseFloat(getParam("size","1"))||1,text=getParam("text",""),textColor=safeHex(getParam("textcolor","#27302D"),"#27302D");document.body.style.background=bg;document.getElementById("heroText").style.color=textColor;if(text)document.getElementById("heroText").textContent=text;
var c=document.getElementById("c"),ctx=c.getContext("2d"),W,H,dpr,mouse={x:0,y:0,tx:0,ty:0,active:false},last=0,reduced=matchMedia("(prefers-reduced-motion: reduce)").matches,pal=[hexToRgb(color1),hexToRgb(color2),hexToRgb(color3)],TAU=Math.PI*2;
function resize(){W=innerWidth;H=innerHeight;dpr=Math.min(devicePixelRatio||1,2);c.width=W*dpr;c.height=H*dpr;ctx.setTransform(dpr,0,0,dpr,0,0);if(!mouse.active)mouse.x=mouse.tx=W*.5,mouse.y=mouse.ty=H*.5}
function render(t){ctx.clearRect(0,0,W,H);var base=Math.min(W,H)*.018*size;for(var n=0;n<Math.round(18*density);n++){var r=base*(n+1)*2.5*(1+Math.sin(t*.00032*speed+n*.31)*.035),col=pal[n%3],a=.11+(n%4)*.018;ctx.beginPath();for(var j=0;j<=72;j++){var a0=j/72*TAU,x=Math.cos(a0)*r,y=Math.sin(a0)*r*.72;var dx=x-mouse.x+W*.5,dy=y-mouse.y+H*.5,dist=Math.sqrt(dx*dx+dy*dy)||1,force=Math.max(0,1-dist/(Math.min(W,H)*.7));x+=dx/dist*force*Math.min(W,H)*.12;y+=dy/dist*force*Math.min(W,H)*.12;var wave=Math.sin(a0*3+n+t*.0004*speed)*base*.32;x+=Math.cos(a0)*wave;y+=Math.sin(a0)*wave;var px=W*.5+x,py=H*.5+y;if(j===0)ctx.moveTo(px,py);else ctx.lineTo(px,py)}ctx.strokeStyle="rgba("+col.r+","+col.g+","+col.b+","+a+")";ctx.lineWidth=1.15;ctx.stroke()}}
function step(t){var dt=Math.min(40,t-last||16);last=t;if(!mouse.active){mouse.tx=W*.5+Math.sin(t*.00014)*W*.14;mouse.ty=H*.5+Math.cos(t*.00017)*H*.1}mouse.x+=(mouse.tx-mouse.x)*.06;mouse.y+=(mouse.ty-mouse.y)*.06;render(t);if(!reduced)requestAnimationFrame(step)}addEventListener("resize",resize,{passive:true});addEventListener("mousemove",function(e){mouse.tx=e.clientX;mouse.ty=e.clientY;mouse.active=true},{passive:true});addEventListener("mouseleave",function(){mouse.active=false},{passive:true});addEventListener("touchmove",function(e){if(e.touches[0]){mouse.tx=e.touches[0].clientX;mouse.ty=e.touches[0].clientY;mouse.active=true}},{passive:true});resize();if(reduced)render(0);else requestAnimationFrame(step)
})();
</script></body></html>
