<!DOCTYPE html>
<!--
  FROSTED SHARDS — glassy polygon tiles that shatter and reform, refracting light on hover
  ------------------------------------------------------------------------------------------
  <iframe src="frosted-shards.html?color1=%23A8D8FF&color2=%23FFB3E6&bg=%230A1020&speed=1&text=Hello"
    style="position:fixed;inset:0;width:100%;height:100%;border:0;z-index:-1;" loading="lazy"></iframe>

  Query params:
    color1     hex, primary tint color      default #A8D8FF
    color2     hex, accent tint color       default #FFB3E6
    bg         hex, background color        default #0A1020
    speed      float multiplier for motion  default 1
    density    float, tile density          default 1
    text       optional hero text overlay   default "" (none)
    textcolor  hex, hero text color         default #FFFFFF
-->
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Frosted Shards Background</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<style>
  html,body{ margin:0; padding:0; width:100%; height:100%; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',Inter,sans-serif; }
  .stage{ position:relative; width:100%; height:100%; }
  canvas{ position:absolute; inset:0; display:block; }
  .hero{
    position:absolute; inset:0; display:flex; align-items:center; justify-content:center;
    pointer-events:none;
  }
  .hero span{
    font-size:clamp(1.8rem, 5vw, 4rem);
    font-weight:600;
    letter-spacing:-0.02em;
    text-align:center;
    padding:0 1rem;
    text-shadow:0 4px 30px rgba(0,0,0,0.6);
    opacity:0;
    animation:reveal 1.4s ease forwards 0.3s;
  }
  @keyframes reveal{
    to{ opacity:1; transform:translateY(0); }
    from{ opacity:0; transform:translateY(12px); }
  }
</style>
</head>
<body>
<div class="stage" id="stage">
  <canvas id="c"></canvas>
  <div class="hero"><span id="heroText"></span></div>
</div>

<script>
(function(){
  function getParam(name, fallback){
    var v = new URLSearchParams(window.location.search).get(name);
    return (v === null || v === "") ? fallback : v;
  }
  function safeHex(v, fallback){
    return /^#([0-9A-Fa-f]{3}){1,2}$/.test(v) ? v : fallback;
  }
  function hexToRgb(hex){
    hex = hex.replace('#','');
    if(hex.length===3){ hex = hex.split('').map(function(c){return c+c;}).join(''); }
    var num = parseInt(hex,16);
    return { r:(num>>16)&255, g:(num>>8)&255, b:num&255 };
  }
  function lerpRgb(a,b,t){
    return { r:a.r+(b.r-a.r)*t, g:a.g+(b.g-a.g)*t, b:a.b+(b.b-a.b)*t };
  }

  var c1hex = safeHex(getParam("color1", "#A8D8FF"), "#A8D8FF");
  var c2hex = safeHex(getParam("color2", "#FFB3E6"), "#FFB3E6");
  var bg = safeHex(getParam("bg", "#0A1020"), "#0A1020");
  var speed = parseFloat(getParam("speed", "1")) || 1;
  var density = parseFloat(getParam("density", "1")) || 1;
  var text = getParam("text", "");
  var textColor = safeHex(getParam("textcolor", "#FFFFFF"), "#FFFFFF");

  var c1 = hexToRgb(c1hex);
  var c2 = hexToRgb(c2hex);

  document.body.style.background = bg;
  document.getElementById("heroText").style.color = textColor;
  if(text){ document.getElementById("heroText").textContent = text; }

  var canvas = document.getElementById("c");
  var ctx = canvas.getContext("2d");
  var W, H;
  var mouse = { x: -1000, y: -1000, active: false };
  var shards = [];
  var t = 0;

  function Shard(){
    this.cx = Math.random() * W;
    this.cy = Math.random() * H;
    this.size = (60 + Math.random() * 120) / density;
    this.angle = Math.random() * Math.PI * 2;
    this.angVel = (Math.random()-0.5) * 0.003 * speed;
    this.vx = (Math.random()-0.5) * 0.18 * speed;
    this.vy = (Math.random()-0.5) * 0.18 * speed;
    this.sides = 3 + Math.floor(Math.random() * 3); // 3-5 sides
    this.phase = Math.random() * Math.PI * 2;
    this.colorT = Math.random();
  }

  Shard.prototype.update = function(){
    this.angle += this.angVel;
    // mouse repulsion
    if(mouse.active){
      var dx = this.cx - mouse.x, dy = this.cy - mouse.y;
      var d2 = dx*dx + dy*dy;
      if(d2 < 200*200){
        var d = Math.sqrt(d2);
        var f = (200 - d) / 200 * 0.8;
        this.vx += (dx/d) * f;
        this.vy += (dy/d) * f;
      }
    }
    this.vx *= 0.978;
    this.vy *= 0.978;
    this.cx += this.vx;
    this.cy += this.vy;
    if(this.cx < -this.size) this.cx = W + this.size;
    if(this.cx > W + this.size) this.cx = -this.size;
    if(this.cy < -this.size) this.cy = H + this.size;
    if(this.cy > H + this.size) this.cy = -this.size;
  };

  Shard.prototype.draw = function(){
    var breathe = 1 + 0.06 * Math.sin(t * 0.7 + this.phase);
    var s = this.size * breathe;
    var c = lerpRgb(c1, c2, this.colorT);

    // mouse proximity brightening
    var brightness = 1;
    if(mouse.active){
      var dx = this.cx - mouse.x, dy = this.cy - mouse.y;
      var d = Math.sqrt(dx*dx+dy*dy);
      if(d < 250) brightness = 1 + (1 - d/250) * 1.2;
    }

    ctx.save();
    ctx.translate(this.cx, this.cy);
    ctx.rotate(this.angle);
    ctx.beginPath();
    for(var i=0;i<this.sides;i++){
      var a = (Math.PI*2/this.sides)*i;
      if(i===0) ctx.moveTo(Math.cos(a)*s, Math.sin(a)*s);
      else ctx.lineTo(Math.cos(a)*s, Math.sin(a)*s);
    }
    ctx.closePath();

    // frosted glass fill
    var fillAlpha = 0.06 * brightness;
    ctx.fillStyle = "rgba(" + Math.min(255,c.r*brightness) + "," + Math.min(255,c.g*brightness) + "," + Math.min(255,c.b*brightness) + "," + fillAlpha + ")";
    ctx.fill();

    // rim / edge glow
    ctx.strokeStyle = "rgba(" + Math.min(255,c.r*brightness) + "," + Math.min(255,c.g*brightness) + "," + Math.min(255,c.b*brightness) + "," + (0.45 * brightness) + ")";
    ctx.lineWidth = 1;
    ctx.shadowColor = "rgba(" + c.r + "," + c.g + "," + c.b + ",0.5)";
    ctx.shadowBlur = 8 * brightness;
    ctx.stroke();

    // inner highlight
    ctx.beginPath();
    var ha = (Math.PI*2/this.sides)*0.5;
    ctx.moveTo(Math.cos(ha)*s*0.6, Math.sin(ha)*s*0.6);
    ctx.lineTo(Math.cos(ha+Math.PI/this.sides)*s*0.25, Math.sin(ha+Math.PI/this.sides)*s*0.25);
    ctx.strokeStyle = "rgba(255,255,255," + (0.18 * brightness) + ")";
    ctx.shadowBlur = 0;
    ctx.lineWidth = 0.8;
    ctx.stroke();

    ctx.restore();
  };

  function resize(){
    W = canvas.width = window.innerWidth;
    H = canvas.height = window.innerHeight;
    var count = Math.floor(W * H / 22000 * density);
    shards = [];
    for(var i=0;i<count;i++) shards.push(new Shard());
  }

  function step(){
    ctx.fillStyle = bg;
    ctx.fillRect(0,0,W,H);

    for(var i=0;i<shards.length;i++){
      shards[i].update();
      shards[i].draw();
    }
    t += 0.018 * speed;
    requestAnimationFrame(step);
  }

  window.addEventListener("resize", resize, { passive:true });
  window.addEventListener("mousemove", function(e){ mouse.x=e.clientX; mouse.y=e.clientY; mouse.active=true; }, { passive:true });
  window.addEventListener("mouseleave", function(){ mouse.active=false; });
  window.addEventListener("touchmove", function(e){ if(e.touches[0]){ mouse.x=e.touches[0].clientX; mouse.y=e.touches[0].clientY; mouse.active=true; } }, { passive:true });

  resize();
  step();
})();
</script>
</body>
</html>
